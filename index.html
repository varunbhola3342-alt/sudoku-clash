<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudoku Clash 1v1 | Real Money Arena</title>
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Sudoku Clash 1v1 | Real Money Arena">
  <meta property="og:description" content="Compete in real-time 1v1 Sudoku cash battles for $10, $25, $50, $100, $150, $200, and $500 stakes!">
  <meta property="og:type" content="website">

  <!-- Mobile PWA Support -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- PeerJS Direct WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- Firebase Cloud SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <!-- CrazyGames SDK v2 -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v2.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-danger: #f43f5e;
      --accent-success: #10b981;
      --text: #f8fafc;
      --cell-bg: #334155;
      --cell-selected: #0284c7;
      --cell-highlight: #475569;
      --given-text: #e2e8f0;
      --user-text: #38bdf8;
      --pencil-text: #94a3b8;
      --grid-border: #38bdf8;
    }

    [data-theme="cyberpunk"] {
      --bg: #09090b; --card: #18181b; --accent: #f43f5e; --accent-danger: #a855f7;
      --accent-success: #22c55e; --text: #fafafa; --cell-bg: #27272a; --cell-selected: #e11d48;
      --cell-highlight: #3f3f46; --given-text: #f43f5e; --user-text: #38bdf8; --pencil-text: #a1a1aa;
      --grid-border: #f43f5e;
    }

    [data-theme="arcade"] {
      --bg: #1a0b2e; --card: #2b1055; --accent: #eab308; --accent-danger: #ef4444;
      --accent-success: #10b981; --text: #ffffff; --cell-bg: #40187e; --cell-selected: #ca8a04;
      --cell-highlight: #5b21b6; --given-text: #facc15; --user-text: #4ade80; --pencil-text: #c084fc;
      --grid-border: #eab308;
    }

    [data-theme="light"] {
      --bg: #f1f5f9; --card: #ffffff; --accent: #2563eb; --accent-danger: #dc2626;
      --accent-success: #16a34a; --text: #0f172a; --cell-bg: #e2e8f0; --cell-selected: #93c5fd;
      --cell-highlight: #cbd5e1; --given-text: #1e293b; --user-text: #2563eb; --pencil-text: #64748b;
      --grid-border: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; touch-action: manipulation; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; transition: background 0.3s, color 0.3s; overflow-x: hidden; }

    .shake { animation: shakeAnim 0.35s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }

    header { display: flex; justify-content: space-between; width: 100%; max-width: 500px; margin-bottom: 8px; align-items: center; }
    h1 { font-size: 1.2rem; color: var(--accent); letter-spacing: 0.5px; }

    .stats-bar { display: flex; gap: 4px; font-size: 0.72rem; background: var(--card); padding: 4px 8px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); align-items: center; }

    .lobby-card { width: 100%; max-width: 500px; background: var(--card); border-radius: 12px; padding: 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 8px; }
    .profile-row { display: flex; gap: 6px; align-items: center; }
    .avatar-btn { background: var(--bg); border: 1px solid rgba(255,255,255,0.2); font-size: 1.2rem; padding: 4px 8px; border-radius: 8px; cursor: pointer; }
    input[type="text"] { background: var(--bg); border: 1px solid rgba(255,255,255,0.2); color: var(--text); padding: 6px 8px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; }

    .mode-btn-group { display: flex; gap: 6px; width: 100%; }

    .lobby-row { display: flex; gap: 6px; }

    .battle-header { width: 100%; max-width: 500px; background: var(--card); border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 2px; font-weight: bold; }
    .progress-track { width: 100%; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
    .progress-fill { height: 100%; width: 0%; transition: width 0.3s ease; }
    .fill-you { background: var(--accent); }
    .fill-opp { background: var(--accent-danger); }

    .controls-top { display: flex; gap: 4px; width: 100%; max-width: 500px; margin-bottom: 8px; flex-wrap: wrap; }
    select, .btn { background: var(--card); border: 1px solid rgba(255,255,255,0.2); color: var(--text); padding: 6px 8px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.78rem; transition: all 0.2s; flex: 1; min-width: 60px; text-align: center; }
    .btn-action { background: var(--accent); color: #000; border: none; }
    .btn-action:hover { opacity: 0.9; }
    .btn-free { background: #10b981; color: #000; border: none; }
    .btn-cash { background: #eab308; color: #000; border: none; font-weight: 800; }
    .btn-share { background: #10b981; color: #000; border: none; }
    .btn-pencil.active { background: var(--accent-success); color: #000; border: none; }
    .btn-blitz { background: #eab308; color: #000; border: none; }

    .board-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 1; margin-bottom: 8px; }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(9, 1fr); 
      grid-template-rows: repeat(9, 1fr); 
      background: var(--card); 
      border: 3px solid var(--grid-border); 
      border-radius: 10px; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .cell { 
      background: var(--cell-bg); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.3rem; 
      font-weight: bold; 
      cursor: pointer; 
      position: relative;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .cell:nth-child(3n):not(:nth-child(9n)) { 
      border-right: 3px solid var(--grid-border) !important; 
    }
    .cell:nth-child(n+19):nth-child(-n+27), 
    .cell:nth-child(n+46):nth-child(-n+54) { 
      border-bottom: 3px solid var(--grid-border) !important; 
    }

    .cell.given { color: var(--given-text); font-weight: 900; opacity: 0.85; }
    .cell.user-entered { color: var(--user-text); }
    .cell.selected { background: var(--cell-selected) !important; color: #fff; }
    .cell.related { background: var(--cell-highlight); }

    .pencil-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 100%; height: 100%; pointer-events: none; }
    .pencil-num { font-size: 0.55rem; color: var(--pencil-text); display: flex; align-items: center; justify-content: center; font-weight: 600; }

    .powerups { display: flex; gap: 6px; width: 100%; max-width: 500px; margin-bottom: 6px; }
    .power-btn { flex: 1; padding: 6px; background: var(--card); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; color: var(--text); }

    .taunt-bar { display: flex; justify-content: space-around; width: 100%; max-width: 500px; margin-bottom: 6px; background: var(--card); padding: 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .taunt-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; transition: transform 0.1s; }
    .taunt-btn:hover { transform: scale(1.3); }

    .numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 500px; }
    .num-btn { background: var(--card); border: 1px solid rgba(255,255,255,0.2); color: var(--text); padding: 10px 0; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; }
    .num-btn:hover { background: var(--accent); color: #000; }

    .status-overlay { position: absolute; inset: 0; border-radius: 8px; display: none; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; backdrop-filter: blur(8px); z-index: 10; text-align: center; padding: 20px; }
    .overlay-frozen { background: rgba(56, 189, 248, 0.4); color: #fff; }
    .overlay-fog { background: rgba(0, 0, 0, 0.9); color: #fff; }

    .floating-taunt { position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%); font-size: 4.5rem; z-index: 200; animation: floatUp 2s forwards ease-out; pointer-events: none; }
    
    @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0) scale(0.5); } 50% { transform: translate(-50%, -80px) scale(1.3); } 100% { opacity: 0; transform: translate(-50%, -150px) scale(1); } }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); text-align: center; max-width: 420px; width: 92%; }

    .leader-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.8rem; }
    .leader-table th, .leader-table td { padding: 6px 4px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .leader-table th { color: var(--accent); }

    canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <header>
    <h1>Sudoku Clash ⚔️</h1>
    <div class="stats-bar">
      <span>💵 <b id="cash-val" style="color: #10b981;">$100.00</b></span>
      <button class="btn" style="padding: 2px 6px; font-size: 0.65rem; background: #10b981; color: #000;" onclick="addDeposit()">💳 + Add Cash</button>
      <button class="btn" style="padding: 2px 6px; font-size: 0.65rem;" onclick="openLeaderboard()">🏆 Leaderboard</button>
      <button class="btn" style="padding: 2px 5px; font-size: 0.65rem;" onclick="toggleBGM()" id="bgm-btn">🎵 BGM</button>
      <button class="btn" style="padding: 2px 5px; font-size: 0.65rem;" onclick="toggleAudio()" id="audio-btn">🔊 SFX</button>
      <span>⏱️ <b id="timer">00:00</b></span>
    </div>
  </header>

  <div class="lobby-card">
    <div class="profile-row">
      <button class="avatar-btn" onclick="cycleAvatar()" id="user-avatar">🥷</button>
      <input type="text" id="username-input" value="Player1" style="flex:1;" onchange="saveProfile()">
      <span style="font-size:0.8rem; font-weight:bold; color:var(--accent);">Lvl <b id="user-level-display">1</b></span>
    </div>

    <!-- GAME MODE SELECTOR -->
    <div class="mode-btn-group">
      <button class="btn btn-free" onclick="startFreePractice()">🧩 Free Match (No BOT)</button>
      <button class="btn btn-cash" onclick="startRealMoneyMatch()">💵 1v1 Real Money Match</button>
    </div>

    <div class="lobby-row">
      <select id="wager-select" style="flex: 1.2;">
        <option value="10">💵 $10 Entry (Win $20)</option>
        <option value="25">💵 $25 Entry (Win $50)</option>
        <option value="50">💵 $50 Entry (Win $100)</option>
        <option value="100" selected>💵 $100 Entry (Win $200)</option>
        <option value="150">💵 $150 Entry (Win $300)</option>
        <option value="200">💵 $200 Entry (Win $400)</option>
        <option value="500">💵 $500 Entry (Win $1000)</option>
      </select>
      <button class="btn" style="flex:1" onclick="createRoom()">Create Room 🏠</button>
      <input type="text" id="room-code-input" placeholder="CODE" maxlength="6" style="width:70px; text-align:center;">
      <button class="btn" onclick="joinRoom()">Join 🔗</button>
    </div>
    <div id="connection-status" style="font-size:0.75rem; text-align:center; color: var(--accent);">
      Mode: Free Practice (Solo / No BOT)
    </div>
  </div>

  <div class="controls-top">
    <select id="theme-select" onchange="changeTheme(this.value)">
      <option value="dark">Dark Theme</option>
      <option value="cyberpunk">Cyberpunk Neon</option>
      <option value="arcade">8-Bit Arcade</option>
      <option value="light">Clean Light</option>
    </select>
    <select id="diff-select" onchange="startNewGame()">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button class="btn btn-blitz" onclick="startDailyBlitz()">📅 Daily Blitz</button>
    <button class="btn btn-pencil" id="pencil-btn" onclick="togglePencil()">✏️ Pencil</button>
    <button class="btn btn-action" onclick="startNewGame()">Reset 🔄</button>
  </div>

  <div class="battle-header" id="battle-header">
    <div class="player-progress" id="you-progress-panel">
      <div class="progress-label"><span id="you-label">You 🥷</span><span id="you-pct">0%</span></div>
      <div class="progress-track"><div id="you-bar" class="progress-fill fill-you"></div></div>
    </div>
    <div class="player-progress" id="opp-progress-panel" style="display:none;">
      <div class="progress-label"><span id="opp-label">Opponent 👤</span><span id="opp-pct">0%</span></div>
      <div class="progress-track"><div id="opp-bar" class="progress-fill fill-opp"></div></div>
    </div>
  </div>

  <div class="board-container" id="board-container">
    <div class="grid" id="grid"></div>
    <div class="status-overlay overlay-frozen" id="frozen-overlay">🧊 YOU ARE FROZEN!<br>(5 Seconds)</div>
    <div class="status-overlay overlay-fog" id="fog-overlay">🌫️ FOG ATTACK!<br>Board Blinded!</div>
  </div>

  <div class="powerups">
    <button class="power-btn" onclick="usePowerup('freeze')" id="btn-freeze">🧊 Freeze (1)</button>
    <button class="power-btn" onclick="usePowerup('fog')" id="btn-fog">🌫️ Fog (1)</button>
    <button class="power-btn" onclick="usePowerup('hint')" id="btn-hint">💡 Hint (2)</button>
  </div>

  <div class="taunt-bar">
    <button class="taunt-btn" onclick="sendTaunt('🔥')">🔥</button>
    <button class="taunt-btn" onclick="sendTaunt('⚡')">⚡</button>
    <button class="taunt-btn" onclick="sendTaunt('💩')">💩</button>
    <button class="taunt-btn" onclick="sendTaunt('🤡')">🤡</button>
    <button class="taunt-btn" onclick="sendTaunt('💀')">💀</button>
  </div>

  <div class="numpad">
    <button class="num-btn" onclick="inputNumber(1)">1</button>
    <button class="num-btn" onclick="inputNumber(2)">2</button>
    <button class="num-btn" onclick="inputNumber(3)">3</button>
    <button class="num-btn" onclick="inputNumber(4)">4</button>
    <button class="num-btn" onclick="inputNumber(5)">5</button>
    <button class="num-btn" onclick="inputNumber(6)">6</button>
    <button class="num-btn" onclick="inputNumber(7)">7</button>
    <button class="num-btn" onclick="inputNumber(8)">8</button>
    <button class="num-btn" onclick="inputNumber(9)">9</button>
    <button class="num-btn" style="color:var(--accent-danger)" onclick="inputNumber(0)">⌫</button>
  </div>

  <!-- Win/Loss Modal -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <h2 id="modal-title">VICTORY!</h2>
      <p id="modal-desc">You crushed the match!</p>
      <button class="btn btn-share" style="width:100%; margin-top:10px;" id="share-btn" onclick="shareResults()">Share Victory 📲</button>
      <button class="btn btn-action" id="modal-next-btn" style="width:100%; margin-top:6px;" onclick="closeModal(); startNextMatch();">Play Next Level 🚀</button>
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div class="modal" id="leaderboard-modal">
    <div class="modal-content">
      <h2>🏆 Global Level Leaderboard</h2>
      <table class="leader-table">
        <thead>
          <tr><th>Rank</th><th>Player</th><th>Level</th><th>Best Time</th><th>Score</th></tr>
        </thead>
        <tbody id="leader-body"></tbody>
      </table>
      <button class="btn btn-action" style="width:100%; margin-top:8px;" onclick="closeLeaderboard()">Close</button>
    </div>
  </div>

  <script>
    // Initialize CrazyGames SDK v2
    let crazyGamesSDK = null;
    window.addEventListener('DOMContentLoaded', () => {
      if (window.CrazyGames && window.CrazyGames.SDK) {
        crazyGamesSDK = window.CrazyGames.SDK;
        crazyGamesSDK.init();
      }
    });

    // Firebase Cloud Database Initialization
    const firebaseConfig = {
      databaseURL: "https://sudoku-clash-arena-default-rtdb.firebaseio.com"
    };
    let db = null;
    try {
      if (window.firebase) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      }
    } catch(e) { console.log("Cloud Database Offline Mode"); }

    let uid = localStorage.getItem('sudoku_uid');
    if (!uid) {
      uid = 'usr_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('sudoku_uid', uid);
    }

    // Real Money Cash Wallet & Progression State
    let cashBalance = parseFloat(localStorage.getItem('sudoku_cash') || '100.00');
    let userLevel = parseInt(localStorage.getItem('sudoku_level') || '1');
    let bestTimeSeconds = parseInt(localStorage.getItem('sudoku_best_time') || '9999');
    let highScore = parseInt(localStorage.getItem('sudoku_high_score') || '0');
    let currentWager = 0;
    let isFreePracticeMode = true;

    function updateWalletUI() {
      document.getElementById('cash-val').innerText = `$${cashBalance.toFixed(2)}`;
      document.getElementById('user-level-display').innerText = userLevel;
      localStorage.setItem('sudoku_cash', cashBalance.toFixed(2));
      localStorage.setItem('sudoku_level', userLevel);
      localStorage.setItem('sudoku_best_time', bestTimeSeconds);
      localStorage.setItem('sudoku_high_score', highScore);
    }

    function addDeposit() {
      cashBalance += 50.00;
      updateWalletUI();
      SFX.powerup();
      showToast("💳 $50.00 Added to Cash Wallet!");
    }

    function showToast(msg) {
      const el = document.createElement('div');
      el.style.position = 'fixed';
      el.style.top = '15%';
      el.style.left = '50%';
      el.style.transform = 'translateX(-50%)';
      el.style.background = 'var(--card)';
      el.style.border = '1px solid var(--accent)';
      el.style.color = '#fff';
      el.style.padding = '10px 18px';
      el.style.borderRadius = '12px';
      el.style.fontWeight = 'bold';
      el.style.fontSize = '0.85rem';
      el.style.zIndex = '300';
      el.style.boxShadow = '0 4px 20px rgba(0,0,0,0.5)';
      el.innerText = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    function deductWager() {
      const wagerVal = parseFloat(document.getElementById('wager-select').value || '10');
      if (cashBalance < wagerVal) {
        showToast("⚠️ Insufficient funds! Click '💳 + Add Cash' to deposit.");
        return false;
      }
      currentWager = wagerVal;
      cashBalance -= currentWager;
      updateWalletUI();
      return true;
    }

    let soundMuted = false;
    let bgmMuted = true;
    let bgmInterval = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function triggerShake() {
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 350);
    }

    function playTone(freq, duration, type = 'sine') {
      if (soundMuted) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function toggleAudio() {
      soundMuted = !soundMuted;
      document.getElementById('audio-btn').innerText = soundMuted ? '🔇 SFX' : '🔊 SFX';
    }

    const SFX = {
      click: () => { playTone(440, 0.08); },
      error: () => { playTone(140, 0.25, 'sawtooth'); triggerShake(); },
      powerup: () => { playTone(520, 0.08); setTimeout(() => playTone(780, 0.12), 80); },
      win: () => { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 0.18), i * 100)); }
    };

    const baseAvatars = ['🥷', '👑', '🦊', '🤖', '🐉'];
    let currentAvatarIdx = 0;
    let username = localStorage.getItem('sudoku_username') || ('Player_' + Math.floor(100 + Math.random()*900));

    function loadProfile() {
      document.getElementById('username-input').value = username;
      currentAvatarIdx = parseInt(localStorage.getItem('sudoku_avatar_idx') || '0');
      document.getElementById('user-avatar').innerText = baseAvatars[currentAvatarIdx] || '🥷';
      updateLabels();
      updateWalletUI();
    }

    function cycleAvatar() {
      currentAvatarIdx = (currentAvatarIdx + 1) % baseAvatars.length;
      document.getElementById('user-avatar').innerText = baseAvatars[currentAvatarIdx];
      localStorage.setItem('sudoku_avatar_idx', currentAvatarIdx);
      updateLabels();
      saveToCloudLeaderboard();
    }

    function saveProfile() {
      username = document.getElementById('username-input').value.trim() || 'Player1';
      localStorage.setItem('sudoku_username', username);
      updateLabels();
      saveToCloudLeaderboard();
    }

    function updateLabels() {
      const currentAvatar = baseAvatars[currentAvatarIdx] || '🥷';
      document.getElementById('you-label').innerText = `${username} ${currentAvatar}`;
    }

    function formatTime(secs) {
      if (!secs || secs >= 9999) return "--:--";
      let m = String(Math.floor(secs / 60)).padStart(2, '0');
      let s = String(secs % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function saveToCloudLeaderboard() {
      const currentAvatar = baseAvatars[currentAvatarIdx] || '🥷';
      if (db) {
        db.ref('leaderboard/' + uid).set({
          name: username,
          level: userLevel,
          bestTime: bestTimeSeconds,
          score: highScore,
          avatar: currentAvatar,
          updatedAt: Date.now()
        });
      }
    }

    function shareResults() {
      const currentAvatar = baseAvatars[currentAvatarIdx] || '🥷';
      const shareText = `⚔️ Sudoku Clash Real Money Arena\nPlayer: ${username} ${currentAvatar}\n🏆 Level: ${userLevel} | Best Time: ${formatTime(bestTimeSeconds)}\nHigh Score: ${highScore} pts\nPlay live: ${window.location.href}`;
      
      if (navigator.share) {
        navigator.share({ title: 'Sudoku Clash Result', text: shareText, url: window.location.href }).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareText);
        showToast("📋 Results Copied to Clipboard!");
      }
    }

    let solution = [], board = [], userBoard = [], candidates = Array.from({length: 81}, () => new Set());
    let selectedCell = null, timerInterval = null, secondsElapsed = 0;
    let powerups = { freeze: 1, fog: 1, hint: 2 };
    let isFrozen = false, pencilMode = false, oppProgress = 0;

    let peer = null, conn = null, isHost = false, isOnline = false;

    function changeTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
    }

    function togglePencil() {
      pencilMode = !pencilMode;
      const btn = document.getElementById('pencil-btn');
      btn.innerText = pencilMode ? '✏️ Pencil: ON' : '✏️ Pencil';
      btn.classList.toggle('active', pencilMode);
    }

    function startFreePractice() {
      isFreePracticeMode = true;
      currentWager = 0;
      
      document.getElementById('opp-progress-panel').style.display = 'none';
      document.getElementById('connection-status').innerText = '🧩 Free Practice (Solo / No BOT / Untimed Match)';
      
      startNewGame();
    }

    function startRealMoneyMatch() {
      if (!deductWager()) return;
      isFreePracticeMode = false;
      
      document.getElementById('opp-progress-panel').style.display = 'block';
      document.getElementById('opp-label').innerText = 'Searching Player... 👤';
      document.getElementById('connection-status').innerText = `💵 Real Money 1v1 Battle Active (Wager: $${currentWager} | Pot: $${currentWager * 2})!`;
      
      createRoom("CASH");
      startNewGame();
    }

    function startDailyBlitz() {
      isFreePracticeMode = true;
      document.getElementById('opp-progress-panel').style.display = 'none';
      const todaySeed = parseInt(new Date().toISOString().slice(0,10).replace(/-/g,""));
      generateSudoku('medium', todaySeed);
      document.getElementById('connection-status').innerText = "📅 Playing Today's Daily Blitz Challenge!";
      startNewGameUI();
    }

    function generateSudoku(diff, seed = null) {
      const base = Array.from({length: 81}, () => 0);
      solveSudoku(base, seed);
      solution = [...base];
      const removal = { easy: 32, medium: 44, hard: 52 }[diff] || 44;
      board = [...solution];
      let removed = 0;
      while (removed < removal) {
        let idx = Math.floor(Math.random() * 81);
        if (board[idx] !== 0) { board[idx] = 0; removed++; }
      }
      userBoard = [...board];
      candidates = Array.from({length: 81}, () => new Set());
    }

    function solveSudoku(b, seed = null) {
      for (let i = 0; i < 81; i++) {
        if (b[i] === 0) {
          let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
          for (let num of nums) {
            if (isValid(b, i, num)) {
              b[i] = num;
              if (solveSudoku(b, seed)) return true;
              b[i] = 0;
            }
          }
          return false;
        }
      }
      return true;
    }

    function isValid(b, idx, num) {
      let row = Math.floor(idx / 9), col = idx % 9;
      for (let i = 0; i < 9; i++) {
        if (b[row * 9 + i] === num || b[i * 9 + col] === num) return false;
        let boxRow = 3 * Math.floor(row / 3) + Math.floor(i / 3);
        let boxCol = 3 * Math.floor(col / 3) + (i % 3);
        if (b[boxRow * 9 + boxCol] === num) return false;
      }
      return true;
    }

    function createRoom(customPrefix = "CASH") {
      isHost = true;
      const rawCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      const code = `${customPrefix}-${rawCode}`;
      
      peer = new Peer(code);
      
      peer.on('open', (id) => {
        const shortCode = id.replace(`${customPrefix}-`, '');
        document.getElementById('room-code-input').value = shortCode;
        navigator.clipboard.writeText(shortCode);
        document.getElementById('connection-status').innerText = `🏠 Cash Match Code: ${shortCode} (Copied!) Waiting for Real Player...`;
      });

      peer.on('connection', (c) => {
        conn = c;
        c.on('open', () => {
          isOnline = true;
          oppProgress = 0;
          document.getElementById('opp-label').innerText = "Real Player 👤";
          document.getElementById('connection-status').innerText = "🟢 Real Player Connected! Cash Match Live!";
          setupConnection();
          syncBoardToPeer();
        });
      });
    }

    function joinRoom() {
      isFreePracticeMode = false;
      document.getElementById('opp-progress-panel').style.display = 'block';
      let inputVal = document.getElementById('room-code-input').value.trim().toUpperCase();
      if (!inputVal) return showToast("Enter Cash Match Code!");
      
      const fullCode = inputVal.includes('-') ? inputVal : 'CASH-' + inputVal;
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(fullCode);
        conn.on('open', () => {
          isHost = false;
          isOnline = true;
          oppProgress = 0;
          document.getElementById('opp-label').innerText = "Host Opponent 👤";
          document.getElementById('connection-status').innerText = "🟢 Connected to Host! Cash Match Live!";
          setupConnection();
        });
      });
    }

    function setupConnection() {
      conn.on('data', (data) => {
        if (data.type === 'progress') {
          oppProgress = data.value;
          document.getElementById('opp-bar').style.width = oppProgress + '%';
          document.getElementById('opp-pct').innerText = oppProgress + '%';
          if (oppProgress >= 100) triggerGameOver(false);
        } else if (data.type === 'attack') {
          receiveAttack(data.attack);
        } else if (data.type === 'taunt') {
          displayFloatingTaunt(data.emoji);
        } else if (data.type === 'sync') {
          solution = data.solution;
          board = data.board;
          userBoard = [...board];
          renderBoard();
        }
      });
    }

    function syncBoardToPeer() {
      if (conn && conn.open) {
        conn.send({ type: 'sync', solution, board });
      }
    }

    function sendTaunt(emoji) {
      displayFloatingTaunt(emoji);
      if (conn && conn.open) conn.send({ type: 'taunt', emoji });
    }

    function displayFloatingTaunt(emoji) {
      SFX.click();
      const el = document.createElement('div');
      el.className = 'floating-taunt';
      el.innerText = emoji;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }

    function startNextMatch() {
      startNewGame();
    }

    function renderBoard() {
      const grid = document.getElementById('grid');
      if (!grid) return;
      grid.innerHTML = '';
      for (let i = 0; i < 81; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (board[i] !== undefined && board[i] !== 0) {
          cell.innerText = board[i];
          cell.classList.add('given');
        } else if (userBoard[i] !== undefined && userBoard[i] !== 0) {
          cell.innerText = userBoard[i];
          cell.classList.add('user-entered');
        } else if (candidates[i] && candidates[i].size > 0) {
          const pGrid = document.createElement('div');
          pGrid.className = 'pencil-grid';
          for (let n = 1; n <= 9; n++) {
            const pNum = document.createElement('div');
            pNum.className = 'pencil-num';
            pNum.innerText = candidates[i].has(n) ? n : '';
            pGrid.appendChild(pNum);
          }
          cell.appendChild(pGrid);
        }
        cell.onclick = () => selectCell(i);
        grid.appendChild(cell);
      }
      updateHighlights();
      updateProgress();
    }

    function selectCell(idx) {
      if (isFrozen) return;
      SFX.click();
      selectedCell = idx;
      updateHighlights();
    }

    function updateHighlights() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach((c, i) => {
        c.classList.remove('selected', 'related');
        if (selectedCell !== null) {
          if (i === selectedCell) c.classList.add('selected');
          else if (Math.floor(i / 9) === Math.floor(selectedCell / 9) || i % 9 === selectedCell % 9) {
            c.classList.add('related');
          }
        }
      });
    }

    function inputNumber(num) {
      if (selectedCell === null || board[selectedCell] !== 0 || isFrozen) return;

      if (pencilMode && num !== 0) {
        SFX.click();
        if (candidates[selectedCell].has(num)) candidates[selectedCell].delete(num);
        else candidates[selectedCell].add(num);
      } else {
        if (candidates[selectedCell]) candidates[selectedCell].clear();
        if (num === 0) {
          userBoard[selectedCell] = 0;
        } else {
          if (num === solution[selectedCell]) {
            SFX.click();
          } else {
            SFX.error();
          }
          userBoard[selectedCell] = num;
        }
      }
      renderBoard();
      checkWinCondition();
    }

    function updateProgress() {
      let filled = 0, totalEmpty = 81 - board.filter(x => x !== 0).length;
      userBoard.forEach((val, i) => {
        if (board[i] === 0 && val === solution[i]) filled++;
      });
      let pct = totalEmpty > 0 ? Math.round((filled / totalEmpty) * 100) : 0;
      document.getElementById('you-bar').style.width = pct + '%';
      document.getElementById('you-pct').innerText = pct + '%';

      if (conn && conn.open) conn.send({ type: 'progress', value: pct });
    }

    function usePowerup(type) {
      if (powerups[type] <= 0) return;
      SFX.powerup();
      powerups[type]--;
      document.getElementById(`btn-${type}`).innerText = `${type.toUpperCase()} (${powerups[type]})`;

      if (type === 'hint' && selectedCell !== null && board[selectedCell] === 0) {
        userBoard[selectedCell] = solution[selectedCell];
        if (candidates[selectedCell]) candidates[selectedCell].clear();
        renderBoard();
      } else if (conn && conn.open) {
        conn.send({ type: 'attack', attack: type });
      }
    }

    function receiveAttack(type) {
      SFX.error();
      triggerShake();
      if (type === 'freeze') {
        isFrozen = true;
        const ov = document.getElementById('frozen-overlay');
        ov.style.display = 'flex';
        setTimeout(() => { isFrozen = false; ov.style.display = 'none'; }, 5000);
      } else if (type === 'fog') {
        const fog = document.getElementById('fog-overlay');
        fog.style.display = 'flex';
        setTimeout(() => fog.style.display = 'none', 4000);
      }
    }

    function checkWinCondition() {
      if (!userBoard || userBoard.length !== 81 || !solution || solution.length !== 81) return;
      let isComplete = userBoard.every((val, i) => val === solution[i]);
      if (isComplete) triggerGameOver(true);
    }

    function triggerGameOver(isWin) {
      clearInterval(timerInterval);

      const modal = document.getElementById('game-modal');
      const title = document.getElementById('modal-title');
      const desc = document.getElementById('modal-desc');

      if (isWin) {
        SFX.win();
        launchConfetti();
        
        // Progression & Score Logic
        userLevel += 1;
        if (secondsElapsed < bestTimeSeconds) bestTimeSeconds = secondsElapsed;
        
        const earnedScore = Math.max(100, (userLevel * 1000) - (secondsElapsed * 5));
        highScore += earnedScore;

        let winMsg = `Completed Level in ${formatTime(secondsElapsed)}! +${earnedScore} pts earned!`;

        if (currentWager > 0) {
          const cashPrize = currentWager * 2;
          cashBalance += cashPrize;
          winMsg += ` 💰 Cash Won: $${cashPrize.toFixed(2)}!`;
        }

        title.innerText = "LEVEL CLEARED! 🏆";
        desc.innerText = winMsg;
      } else {
        SFX.error();
        title.innerText = "MATCH LOST! 💀";
        title.style.color = "var(--accent-danger)";
        desc.innerText = `Opponent solved first! Lost $${currentWager.toFixed(2)} wager stake.`;
      }

      updateWalletUI();
      saveToCloudLeaderboard();

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('game-modal').classList.remove('active');
    }

    function openLeaderboard() {
      const modal = document.getElementById('leaderboard-modal');
      const tbody = document.getElementById('leader-body');
      tbody.innerHTML = '<tr><td colspan="5">Syncing Global Level Leaderboard...</td></tr>';
      modal.classList.add('active');

      if (db) {
        db.ref('leaderboard').once('value', (snapshot) => {
          let list = [];
          snapshot.forEach((child) => {
            list.push(child.val());
          });
          list.sort((a,b) => (b.level - a.level) || (b.score - a.score));
          renderLeaderboardRows(list.slice(0, 10));
        }).catch(() => renderFallbackLeaderboard());
      } else {
        renderFallbackLeaderboard();
      }
    }

    function renderLeaderboardRows(list) {
      const tbody = document.getElementById('leader-body');
      if (!list || list.length === 0) {
        renderFallbackLeaderboard();
        return;
      }
      tbody.innerHTML = list.map((player, idx) => `
        <tr>
          <td>#${idx + 1}</td>
          <td>${player.name || 'Player'} ${player.avatar || '🥷'}</td>
          <td><b>Lvl ${player.level || 1}</b></td>
          <td>${formatTime(player.bestTime)}</td>
          <td><b>${player.score || 0}</b></td>
        </tr>
      `).join('');
    }

    function renderFallbackLeaderboard() {
      const tbody = document.getElementById('leader-body');
      const currentAvatar = baseAvatars[currentAvatarIdx] || '🥷';
      const mockLeaders = [
        { name: "CyberKing 👑", level: 18, bestTime: 112, score: 24500 },
        { name: "GridMaster ⚡", level: 14, bestTime: 135, score: 18900 },
        { name: "SudokuNinja 🥷", level: 11, bestTime: 150, score: 14200 },
        { name: `${username} ${currentAvatar}`, level: userLevel, bestTime: bestTimeSeconds, score: highScore }
      ].sort((a,b) => (b.level - a.level) || (b.score - a.score));

      tbody.innerHTML = mockLeaders.map((player, idx) => `
        <tr>
          <td>#${idx + 1}</td>
          <td>${player.name}</td>
          <td><b>Lvl ${player.level}</b></td>
          <td>${formatTime(player.bestTime)}</td>
          <td><b>${player.score}</b></td>
        </tr>
      `).join('');
    }

    function closeLeaderboard() {
      document.getElementById('leaderboard-modal').classList.remove('active');
    }

    function startNewGameUI() {
      selectedCell = null;
      secondsElapsed = 0;
      powerups = { freeze: 1, fog: 1, hint: 2 };

      document.getElementById('btn-freeze').innerText = `🧊 Freeze (1)`;
      document.getElementById('btn-fog').innerText = `🌫️ Fog (1)`;
      document.getElementById('btn-hint').innerText = `💡 Hint (2)`;

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        document.getElementById('timer').innerText = formatTime(secondsElapsed);
      }, 1000);

      renderBoard();
      syncBoardToPeer();
    }

    function startNewGame() {
      const diffElem = document.getElementById('diff-select');
      const diff = diffElem ? diffElem.value : 'medium';
      generateSudoku(diff);
      startNewGameUI();
    }

    function launchConfetti() {
      const cvs = document.getElementById('confetti');
      const ctx = cvs.getContext('2d');
      cvs.width = window.innerWidth; cvs.height = window.innerHeight;
      let particles = Array.from({length: 70}, () => ({
        x: cvs.width / 2, y: cvs.height / 2,
        vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10 - 3,
        size: Math.random() * 8 + 4, color: `hsl(${Math.random()*360}, 100%, 50%)`
      }));

      function render() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.2;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        if (particles.some(p => p.y < cvs.height)) requestAnimationFrame(render);
      }
      render();
    }

    window.onload = () => {
      loadProfile();
      saveToCloudLeaderboard();
      startFreePractice();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudoku Clash 1v1 | Esports Arena</title>
  
  <!-- Mobile PWA Support -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Sudoku%20Clash%201v1%22,%22short_name%22:%22SudokuClash%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f172a%22,%22theme_color%22:%22%230f172a%22}">

  <!-- PeerJS Direct WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- Firebase Cloud SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-danger: #f43f5e;
      --accent-success: #10b981;
      --text: #f8fafc;
      --cell-bg: #334155;
      --cell-selected: #0284c7;
      --cell-highlight: #475569;
      --given-text: #e2e8f0;
      --user-text: #38bdf8;
      --pencil-text: #94a3b8;
      --grid-border: #38bdf8;
    }

    [data-theme="cyberpunk"] {
      --bg: #09090b; --card: #18181b; --accent: #f43f5e; --accent-danger: #a855f7;
      --accent-success: #22c55e; --text: #fafafa; --cell-bg: #27272a; --cell-selected: #e11d48;
      --cell-highlight: #3f3f46; --given-text: #f43f5e; --user-text: #38bdf8; --pencil-text: #a1a1aa;
      --grid-border: #f43f5e;
    }

    [data-theme="arcade"] {
      --bg: #1a0b2e; --card: #2b1055; --accent: #eab308; --accent-danger: #ef4444;
      --accent-success: #10b981; --text: #ffffff; --cell-bg: #40187e; --cell-selected: #ca8a04;
      --cell-highlight: #5b21b6; --given-text: #facc15; --user-text: #4ade80; --pencil-text: #c084fc;
      --grid-border: #eab308;
    }

    [data-theme="light"] {
      --bg: #f1f5f9; --card: #ffffff; --accent: #2563eb; --accent-danger: #dc2626;
      --accent-success: #16a34a; --text: #0f172a; --cell-bg: #e2e8f0; --cell-selected: #93c5fd;
      --cell-highlight: #cbd5e1; --given-text: #1e293b; --user-text: #2563eb; --pencil-text: #64748b;
      --grid-border: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; touch-action: manipulation; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; transition: background 0.3s, color 0.3s; overflow-x: hidden; }

    /* Screen Shake FX */
    .shake { animation: shakeAnim 0.35s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }

    header { display: flex; justify-content: space-between; width: 100%; max-width: 500px; margin-bottom: 8px; align-items: center; }
    h1 { font-size: 1.2rem; color: var(--accent); letter-spacing: 0.5px; }

    .stats-bar { display: flex; gap: 4px; font-size: 0.72rem; background: var(--card); padding: 4px 8px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); align-items: center; }

    .lobby-card { width: 100%; max-width: 500px; background: var(--card); border-radius: 12px; padding: 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 6px; }
    .profile-row { display: flex; gap: 6px; align-items: center; }
    .avatar-btn { background: var(--bg); border: 1px solid rgba(255,255,255,0.2); font-size: 1.2rem; padding: 4px 8px; border-radius: 8px; cursor: pointer; }
    input[type="text"] { background: var(--bg); border: 1px solid rgba(255,255,255,0.2); color: var(--text); padding: 6px 8px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; }

    .lobby-row { display: flex; gap: 6px; }

    .battle-header { width: 100%; max-width: 500px; background: var(--card); border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 2px; font-weight: bold; }
    .progress-track { width: 100%; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
    .progress-fill { height: 100%; width: 0%; transition: width 0.3s ease; }
    .fill-you { background: var(--accent); }
    .fill-opp { background: var(--accent-danger); }
    .fill-boss { background: #dc2626; }

    .controls-top { display: flex; gap: 4px; width: 100%; max-width: 500px; margin-bottom: 8px; flex-wrap: wrap; }
    select, .btn { background: var(--card); border: 1px solid rgba(255,255,255,0.2); color: var(--text); padding: 6px 8px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.78rem; transition: all 0.2s; flex: 1; min-width: 60px; text-align: center; }
    .btn-action { background: var(--accent); color: #000; border: none; }
    .btn-action:hover { opacity: 0.9; }
    .btn-tourney { background: #a855f7; color: #fff; border: none; }
    .btn-boss { background: #dc2626; color: #fff; border: none; }
    .btn-share { background: #10b981; color: #000; border: none; }
    .btn-pencil.active { background: var(--accent-success); color: #000; border: none; }
    .btn-blitz { background: #eab308; color: #000; border: none; }

    /* Crisp Sudoku Board with Clear 3x3 Sub-Grid Borders */
    .board-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 1; margin-bottom: 8px; }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(9, 1fr); 
      grid-template-rows: repeat(9, 1fr); 
      background: var(--card); 
      border: 3px solid var(--grid-border); 
      border-radius: 10px; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .cell { 
      background: var(--cell-bg); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.3rem; 
      font-weight: bold; 
      cursor: pointer; 
      position: relative;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Distinct 3x3 Sub-Grid Block Borders */
    .cell:nth-child(3n):not(:nth-child(9n)) { 
      border-right: 3px solid var(--grid-border) !important; 
    }
    .cell:nth-child(n+19):nth-child(-n+27), 
    .cell:nth-child(n+46):nth-child(-n+54) { 
      border-bottom: 3px solid var(--grid-border) !important; 
    }

    .cell.given { color: var(--given-text); font-weight: 900; opacity: 0.85; }
    .cell.user-entered { color: var(--user-text); }
    .cell.selected { background: var(--cell-selected) !important; color: #fff; }
    .cell.related { background: var(--cell-highlight); }

    .pencil-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 100%; height: 100%; pointer-events: none; }
    .pencil-num { font-size: 0.55rem; color: var(--pencil-text); display: flex; align-items: center; justify-content: center; font-weight: 600; }

    .powerups { display: flex; gap: 6px; width: 100%; max-width: 500px; margin-bottom: 6px; }
    .power-btn { flex: 1; padding: 6px; background: var(--card); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; color: var(--text); }

    .taunt-bar { display: flex; justify-content: space-around; width: 100%; max-width: 500px; margin-bottom: 6px; background: var(--card); padding: 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .taunt-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; transition: transform 0.1s; }
    .taunt-btn:hover { transform: scale(1.3); }

    .numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 500px; }
    .num-btn { background: var(--card); border: 1px solid rgba(255,255,255,0.2); color: var(--text); padding: 10px 0; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; }
    .num-btn:hover { background: var(--accent); color: #000; }

    .status-overlay { position: absolute; inset: 0; border-radius: 8px; display: none; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; backdrop-filter: blur(8px); z-index: 10; text-align: center; padding: 20px; }
    .overlay-frozen { background: rgba(56, 189, 248, 0.4); color: #fff; }
    .overlay-fog { background: rgba(0, 0, 0, 0.9); color: #fff; }

    .floating-taunt { position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%); font-size: 4.5rem; z-index: 200; animation: floatUp 2s forwards ease-out; pointer-events: none; }
    
    .floating-damage { position: absolute; font-weight: 900; font-size: 1.4rem; color: #f43f5e; pointer-events: none; z-index: 50; animation: floatDamage 1s forwards ease-out; text-shadow: 0 0 8px rgba(0,0,0,0.8); }
    @keyframes floatDamage { 0% { opacity: 1; transform: translateY(0) scale(0.8); } 50% { transform: translateY(-30px) scale(1.3); } 100% { opacity: 0; transform: translateY(-60px) scale(1); } }

    @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0) scale(0.5); } 50% { transform: translate(-50%, -80px) scale(1.3); } 100% { opacity: 0; transform: translate(-50%, -150px) scale(1); } }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); text-align: center; max-width: 360px; width: 92%; }

    .leader-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.85rem; }
    .leader-table th, .leader-table td { padding: 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .leader-table th { color: var(--accent); }

    .bracket-container { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; font-size: 0.75rem; text-align: left; }
    .bracket-round-title { font-weight: bold; color: var(--accent); text-transform: uppercase; font-size: 0.7rem; margin-top: 4px; }
    .bracket-match { background: var(--bg); padding: 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
    .bracket-match.active-match { border-color: var(--accent); background: rgba(56, 189, 248, 0.15); }
    .bracket-winner { color: var(--accent-success); font-weight: bold; }

    canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <header>
    <h1>Sudoku Clash ⚔️</h1>
    <div class="stats-bar">
      <span>🪙 <b id="coin-val" style="color: #eab308;">1000</b></span>
      <button class="btn" style="padding: 2px 5px; font-size: 0.65rem; background: #eab308; color: #000;" onclick="claimFreeCoins()">📺 +500</button>
      <button class="btn" style="padding: 2px 5px; font-size: 0.65rem;" onclick="openLeaderboard()">🏆 Ranks</button>
      <button class="btn" style="padding: 2px 5px; font-size: 0.65rem;" onclick="toggleBGM()" id="bgm-btn">🎵 BGM</button>
      <button class="btn" style="padding: 2px 5px; font-size: 0.65rem;" onclick="toggleAudio()" id="audio-btn">🔊 SFX</button>
      <span id="rank-badge">🥉</span>
      <span><b id="elo-val">1000</b></span>
      <span>⏱️ <b id="timer">00:00</b></span>
    </div>
  </header>

  <div class="lobby-card">
    <div class="profile-row">
      <button class="avatar-btn" onclick="cycleAvatar()" id="user-avatar">🥷</button>
      <input type="text" id="username-input" value="Player1" style="flex:1;" onchange="saveProfile()">
      <button class="btn btn-action" onclick="quickMatch()">Quick ⚡</button>
      <button class="btn btn-tourney" onclick="startTournament()">🥊 Tourney</button>
      <button class="btn btn-boss" onclick="startBossRaid()">👾 Boss</button>
    </div>
    <div class="lobby-row">
      <select id="wager-select" style="flex: 1.2;">
        <option value="100">💰 Bet 100 Coins</option>
        <option value="250">💰 Bet 250 Coins</option>
        <option value="500">💰 Bet 500 Coins</option>
      </select>
      <button class="btn" style="flex:1" onclick="createRoom()">Create Room 🏠</button>
      <input type="text" id="room-code-input" placeholder="CODE" maxlength="6" style="width:70px; text-align:center;">
      <button class="btn" onclick="joinRoom()">Join 🔗</button>
    </div>
    <div id="connection-status" style="font-size:0.75rem; text-align:center; color: var(--accent);">
      Mode: Practice vs AI Bot
    </div>
  </div>

  <div class="controls-top">
    <select id="theme-select" onchange="changeTheme(this.value)">
      <option value="dark">Dark Theme</option>
      <option value="cyberpunk">Cyberpunk Neon</option>
      <option value="arcade">8-Bit Arcade</option>
      <option value="light">Clean Light</option>
    </select>
    <select id="diff-select" onchange="startNewGame()">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button class="btn btn-blitz" onclick="startDailyBlitz()">📅 Blitz</button>
    <button class="btn btn-pencil" id="pencil-btn" onclick="togglePencil()">✏️ Pencil</button>
    <button class="btn btn-action" onclick="startNewGame()">Reset 🔄</button>
  </div>

  <div class="battle-header">
    <div class="player-progress" id="you-progress-panel">
      <div class="progress-label"><span id="you-label">You 🥷</span><span id="you-pct">0%</span></div>
      <div class="progress-track"><div id="you-bar" class="progress-fill fill-you"></div></div>
    </div>
    <div class="player-progress" id="opp-progress-panel">
      <div class="progress-label"><span id="opp-label">Opponent Bot 🤖</span><span id="opp-pct">0%</span></div>
      <div class="progress-track"><div id="opp-bar" class="progress-fill fill-opp"></div></div>
    </div>
  </div>

  <div class="board-container" id="board-container">
    <div class="grid" id="grid"></div>
    <div class="status-overlay overlay-frozen" id="frozen-overlay">🧊 YOU ARE FROZEN!<br>(5 Seconds)</div>
    <div class="status-overlay overlay-fog" id="fog-overlay">🌫️ FOG ATTACK!<br>Board Blinded!</div>
  </div>

  <div class="powerups">
    <button class="power-btn" onclick="usePowerup('freeze')" id="btn-freeze">🧊 Freeze (1)</button>
    <button class="power-btn" onclick="usePowerup('fog')" id="btn-fog">🌫️ Fog (1)</button>
    <button class="power-btn" onclick="usePowerup('hint')" id="btn-hint">💡 Hint (2)</button>
  </div>

  <div class="taunt-bar">
    <button class="taunt-btn" onclick="sendTaunt('🔥')">🔥</button>
    <button class="taunt-btn" onclick="sendTaunt('⚡')">⚡</button>
    <button class="taunt-btn" onclick="sendTaunt('💩')">💩</button>
    <button class="taunt-btn" onclick="sendTaunt('🤡')">🤡</button>
    <button class="taunt-btn" onclick="sendTaunt('💀')">💀</button>
  </div>

  <div class="numpad">
    <button class="num-btn" onclick="inputNumber(1)">1</button>
    <button class="num-btn" onclick="inputNumber(2)">2</button>
    <button class="num-btn" onclick="inputNumber(3)">3</button>
    <button class="num-btn" onclick="inputNumber(4)">4</button>
    <button class="num-btn" onclick="inputNumber(5)">5</button>
    <button class="num-btn" onclick="inputNumber(6)">6</button>
    <button class="num-btn" onclick="inputNumber(7)">7</button>
    <button class="num-btn" onclick="inputNumber(8)">8</button>
    <button class="num-btn" onclick="inputNumber(9)">9</button>
    <button class="num-btn" style="color:var(--accent-danger)" onclick="inputNumber(0)">⌫</button>
  </div>

  <!-- Win/Loss Modal -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <h2 id="modal-title">VICTORY!</h2>
      <p id="modal-desc">You crushed the match!</p>
      <button class="btn btn-share" style="width:100%; margin-top:10px;" id="share-btn" onclick="shareResults()">Share Victory 📲</button>
      <button class="btn btn-action" id="modal-next-btn" style="width:100%; margin-top:6px;" onclick="closeModal(); startNextMatch();">Next Match 🚀</button>
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div class="modal" id="leaderboard-modal">
    <div class="modal-content">
      <h2>🏆 Global Leaderboard</h2>
      <table class="leader-table">
        <thead>
          <tr><th>Rank</th><th>Player</th><th>ELO</th></tr>
        </thead>
        <tbody id="leader-body"></tbody>
      </table>
      <button class="btn btn-action" style="width:100%; margin-top:8px;" onclick="closeLeaderboard()">Close</button>
    </div>
  </div>

  <!-- Tournament Bracket Modal -->
  <div class="modal" id="tourney-modal">
    <div class="modal-content">
      <h2>🥊 8-Player Tournament</h2>
      <div class="bracket-container" id="bracket-display"></div>
      <button class="btn btn-action" style="width:100%; margin-top:10px;" id="tourney-play-btn" onclick="launchTourneyMatch()">Play Next Round ⚔️</button>
    </div>
  </div>

  <script>
    // Firebase Cloud Database Initialization
    const firebaseConfig = {
      databaseURL: "https://sudoku-clash-arena-default-rtdb.firebaseio.com"
    };
    let db = null;
    try {
      if (window.firebase) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      }
    } catch(e) { console.log("Cloud Database Offline Mode"); }

    let uid = localStorage.getItem('sudoku_uid');
    if (!uid) {
      uid = 'usr_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('sudoku_uid', uid);
    }

    // Virtual Coin Economy State
    let coins = parseInt(localStorage.getItem('sudoku_coins') || '1000');
    let currentWager = 100;

    function updateCoinUI() {
      document.getElementById('coin-val').innerText = coins;
      localStorage.setItem('sudoku_coins', coins);
    }

    function claimFreeCoins() {
      coins += 500;
      updateCoinUI();
      SFX.powerup();
      alert("🎉 Rewarded Video Watched! +500 Coins added to your balance!");
    }

    function deductWager() {
      const wagerVal = parseInt(document.getElementById('wager-select').value || '100');
      if (coins < wagerVal) {
        alert("⚠️ Not enough coins for this bet! Click '📺 +500' to claim free coins.");
        return false;
      }
      currentWager = wagerVal;
      coins -= currentWager;
      updateCoinUI();
      return true;
    }

    let soundMuted = false;
    let bgmMuted = true;
    let bgmInterval = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function triggerShake() {
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 350);
    }

    function spawnDamagePopup(text) {
      const el = document.createElement('div');
      el.className = 'floating-damage';
      el.innerText = text;
      el.style.left = (50 + (Math.random() * 20 - 10)) + '%';
      el.style.top = '40%';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    function playTone(freq, duration, type = 'sine') {
      if (soundMuted) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // 8-Bit Procedural BGM Generator
    const bgmNotes = [164.81, 196.00, 220.00, 246.94, 261.63, 220.00, 196.00, 164.81];
    let noteStep = 0;

    function toggleBGM() {
      bgmMuted = !bgmMuted;
      const btn = document.getElementById('bgm-btn');
      btn.innerText = bgmMuted ? '🎵 BGM' : '🎵 BGM: ON';

      if (!bgmMuted) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        bgmInterval = setInterval(() => {
          try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = bgmNotes[noteStep % bgmNotes.length];
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
            noteStep++;
          } catch(e) {}
        }, 220);
      } else {
        clearInterval(bgmInterval);
      }
    }

    function haptic() {
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function toggleAudio() {
      soundMuted = !soundMuted;
      document.getElementById('audio-btn').innerText = soundMuted ? '🔇 SFX' : '🔊 SFX';
    }

    const SFX = {
      click: () => { playTone(440, 0.08); haptic(); },
      error: () => { playTone(140, 0.25, 'sawtooth'); triggerShake(); if(navigator.vibrate) navigator.vibrate([40, 40, 40]); },
      powerup: () => { playTone(520, 0.08); setTimeout(() => playTone(780, 0.12), 80); },
      win: () => { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 0.18), i * 100)); }

    function seededRandom(seed) {
      let x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

      tourneyActive = false;

    function generateSudoku(diff, seed = null) {
      const base = Array.from({length: 81}, () => 0);
      solveSudoku(base, seed);
      solution = [...base];
      const removal = { easy: 32, medium: 44, hard: 52 }[diff] || 44;
      board = [...solution];
      let removed = 0;
      while (removed < removal) {
        let idx = Math.floor((seed ? seededRandom(seed + removed) : Math.random()) * 81);
        if (board[idx] !== 0) { board[idx] = 0; removed++; }
      }
      userBoard = [...board];
      candidates = Array.from({length: 81}, () => new Set());
    }

    function solveSudoku(b, seed = null) {
      for (let i = 0; i < 81; i++) {
        if (b[i] === 0) {
          let nums = [1,2,3,4,5,6,7,8,9].sort(() => (seed ? seededRandom(seed + i) : Math.random()) - 0.5);
          for (let num of nums) {
            if (isValid(b, i, num)) {
              b[i] = num;
              if (solveSudoku(b, seed)) return true;
              b[i] = 0;
            }
          }
          return false;
        }
      }
      return true;
    }

    function isValid(b, idx, num) {
      let row = Math.floor(idx / 9), col = idx % 9;
      for (let i = 0; i < 9; i++) {
        if (b[row * 9 + i] === num || b[i * 9 + col] === num) return false;
        let boxRow = 3 * Math.floor(row / 3) + Math.floor(i / 3);
        let boxCol = 3 * Math.floor(col / 3) + (i % 3);
        if (b[boxRow * 9 + boxCol] === num) return false;
      }
      return true;
    }

    function createRoom(customPrefix = "SUDO") {

      const rawCode = Math.random().toString(36).substring(2, 6).toUpperCase();

    function resetOpponentProgressUI() {

    function setupConnection() {
      conn.on('data', (data) => {
        if (data.type === 'progress') {
          oppProgress = data.value;
          document.getElementById('opp-bar').style.width = oppProgress + '%';
          document.getElementById('opp-pct').innerText = oppProgress + '%';
          if (oppProgress >= 100 && !bossMode) triggerGameOver(false);
        } else if (data.type === 'boss_damage') {
          bossHP = Math.max(0, bossHP - data.amount);
          triggerShake();
          spawnDamagePopup(`-${data.amount} HP 💥`);
          updateBossUI();
          if (bossHP <= 0) triggerGameOver(true, "BOSS SLAIN IN CO-OP! ⚔️");
        } else if (data.type === 'attack') {
          receiveAttack(data.attack);
        } else if (data.type === 'taunt') {
          displayFloatingTaunt(data.emoji);
        } else if (data.type === 'rematch') {
          closeModal();
          if (isHost) startNewGame();
        } else if (data.type === 'sync') {
          solution = data.solution;
          board = data.board;
          userBoard = [...board];
          renderBoard();
        }
      });
    }

    function renderBoard() {
      const grid = document.getElementById('grid');
      if (!grid) return;
      grid.innerHTML = '';
      for (let i = 0; i < 81; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (board[i] !== 0) {
          cell.innerText = board[i];
          cell.classList.add('given');
        } else if (userBoard[i] !== 0) {
          cell.innerText = userBoard[i];
          cell.classList.add('user-entered');
        } else if (candidates[i] && candidates[i].size > 0) {
          const pGrid = document.createElement('div');
          pGrid.className = 'pencil-grid';
          for (let n = 1; n <= 9; n++) {
            const pNum = document.createElement('div');
            pNum.className = 'pencil-num';
            pNum.innerText = candidates[i].has(n) ? n : '';
            pGrid.appendChild(pNum);
          }
          cell.appendChild(pGrid);
        }
        cell.onclick = () => selectCell(i);
        grid.appendChild(cell);
      }
      updateHighlights();
      updateProgress();
    }

    function selectCell(idx) {
      if (isFrozen) return;
      SFX.click();
      selectedCell = idx;
      updateHighlights();

    function updateHighlights() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach((c, i) => {
        c.classList.remove('selected', 'related');
        if (selectedCell !== null) {
          if (i === selectedCell) c.classList.add('selected');
          else if (Math.floor(i / 9) === Math.floor(selectedCell / 9) || i % 9 === selectedCell % 9) {
            c.classList.add('related');
          }

      });

    function inputNumber(num) {
      if (selectedCell === null || board[selectedCell] !== 0 || isFrozen) return;

      if (pencilMode && num !== 0) {
        SFX.click();
        if (candidates[selectedCell].has(num)) candidates[selectedCell].delete(num);
        else candidates[selectedCell].add(num);
      } else {
        if (candidates[selectedCell]) candidates[selectedCell].clear();
        if (num === 0) {
          userBoard[selectedCell] = 0;
        } else {
          if (num === solution[selectedCell]) {
            SFX.click();
            if (bossMode) damageBoss(25);
          } else {
            SFX.error();
          }
          userBoard[selectedCell] = num;

      renderBoard();
      checkWinCondition();

    function updateProgress() {

      let pct = totalEmpty > 0 ? Math.round((filled / totalEmpty) * 100) : 0;
      document.getElementById('you-bar').style.width = pct + '%';

    function renderFallbackLeaderboard() {
      const tbody = document.getElementById('leader-body');
      const avail = getAvailableAvatars();
      const currentAvatar = avail[currentAvatarIdx] || '🥷';
      const mockLeaders = [
        { name: "CyberKing 👑", elo: 1650 },
        { name: "GridMaster ⚡", elo: 1520 },
        { name: "SudokuNinja 🥷", elo: 1440 },
        { name: `${username} ${currentAvatar}`, elo: elo }
      ].sort((a,b) => b.elo - a.elo);

      tbody.innerHTML = mockLeaders.map((player, idx) => `
        <tr>
          <td>#${idx + 1}</td>
          <td>${player.name}</td>
          <td><b>${player.elo}</b></td>
        </tr>
      `).join('');
    }

    function closeLeaderboard() {
      document.getElementById('leaderboard-modal').classList.remove('active');
    }

    function startNewGameUI() {
      selectedCell = null;
      secondsElapsed = 0;
      powerups = { freeze: 1, fog: 1, hint: 2 };

      document.getElementById('btn-freeze').innerText = `🧊 Freeze (1)`;
      document.getElementById('btn-fog').innerText = `🌫️ Fog (1)`;
      document.getElementById('btn-hint').innerText = `💡 Hint (2)`;

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        let m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        let s = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;
      }, 1000);

      renderBoard();
      syncBoardToPeer();
      if (!isOnline && !bossMode) startBot();
    }

    function startNewGame() {
      const diffElem = document.getElementById('diff-select');
      const diff = diffElem ? diffElem.value : 'medium';
      generateSudoku(diff);
      startNewGameUI();
    }

    function launchConfetti() {
      const cvs = document.getElementById('confetti');
      const ctx = cvs.getContext('2d');
      cvs.width = window.innerWidth; cvs.height = window.innerHeight;
      let particles = Array.from({length: 70}, () => ({
        x: cvs.width / 2, y: cvs.height / 2,
        vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10 - 3,
        size: Math.random() * 8 + 4, color: `hsl(${Math.random()*360}, 100%, 50%)`
      }));

      function render() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.2;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        if (particles.some(p => p.y < cvs.height)) requestAnimationFrame(render);
      }
      render();
    }

    window.onload = () => {
      loadProfile();
      updateRankBadge();
      saveToCloudLeaderboard();
      startNewGame();
    };
  </script>
</body>
</html>

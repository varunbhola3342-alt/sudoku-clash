<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Clash 1v1 | Online Arena</title>
  <!-- PeerJS WebRTC Direct Networking -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-danger: #f43f5e;
      --accent-success: #10b981;
      --text: #f8fafc;
      --cell-bg: #334155;
      --cell-selected: #0284c7;
      --cell-highlight: #475569;
      --given-text: #e2e8f0;
      --user-text: #38bdf8;
    }

    [data-theme="cyberpunk"] {
      --bg: #09090b; --card: #18181b; --accent: #f43f5e; --accent-danger: #a855f7;
      --accent-success: #22c55e; --text: #fafafa; --cell-bg: #27272a; --cell-selected: #e11d48;
      --cell-highlight: #3f3f46; --given-text: #f43f5e; --user-text: #38bdf8;
    }

    [data-theme="arcade"] {
      --bg: #1a0b2e; --card: #2b1055; --accent: #eab308; --accent-danger: #ef4444;
      --accent-success: #10b981; --text: #ffffff; --cell-bg: #40187e; --cell-selected: #ca8a04;
      --cell-highlight: #5b21b6; --given-text: #facc15; --user-text: #4ade80;
    }

    [data-theme="light"] {
      --bg: #f1f5f9; --card: #ffffff; --accent: #2563eb; --accent-danger: #dc2626;
      --accent-success: #16a34a; --text: #0f172a; --cell-bg: #e2e8f0; --cell-selected: #93c5fd;
      --cell-highlight: #cbd5e1; --given-text: #1e293b; --user-text: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px; transition: background 0.3s, color 0.3s; }

    header { display: flex; justify-content: space-between; width: 100%; max-width: 500px; margin-bottom: 10px; align-items: center; }
    h1 { font-size: 1.4rem; color: var(--accent); letter-spacing: 0.5px; }

    .stats-bar { display: flex; gap: 8px; font-size: 0.8rem; background: var(--card); padding: 5px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }

    .lobby-card { width: 100%; max-width: 500px; background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 8px; }
    .lobby-row { display: flex; gap: 8px; }
    input[type="text"] { background: var(--bg); border: 1px solid rgba(255,255,255,0.2); color: var(--text); padding: 8px; border-radius: 8px; flex: 1; font-weight: bold; text-align: center; text-transform: uppercase; }

    .battle-header { width: 100%; max-width: 500px; background: var(--card); border-radius: 12px; padding: 10px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 3px; font-weight: bold; }
    .progress-track { width: 100%; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
    .progress-fill { height: 100%; width: 0%; transition: width 0.3s ease; }
    .fill-you { background: var(--accent); }
    .fill-opp { background: var(--accent-danger); }

    .controls-top { display: flex; gap: 8px; width: 100%; max-width: 500px; margin-bottom: 10px; }
    select, .btn { background: var(--card); border: 1px solid rgba(255,255,255,0.2); color: var(--text); padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: all 0.2s; }
    .btn-action { background: var(--accent); color: #000; border: none; }
    .btn-action:hover { opacity: 0.9; }

    .board-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 1; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); gap: 1px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; width: 100%; height: 100%; overflow: hidden; }
    .cell { background: var(--cell-bg); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: bold; cursor: pointer; }
    .cell.given { color: var(--given-text); font-weight: 900; opacity: 0.8; }
    .cell.user-entered { color: var(--user-text); }
    .cell.selected { background: var(--cell-selected) !important; color: #fff; }
    .cell.related { background: var(--cell-highlight); }

    .cell:nth-child(3n) { border-right: 2px solid rgba(255,255,255,0.25); }
    .cell:nth-child(9n) { border-right: none; }
    .cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid rgba(255,255,255,0.25); }

    .powerups { display: flex; gap: 8px; width: 100%; max-width: 500px; margin-bottom: 10px; }
    .power-btn { flex: 1; padding: 8px; background: var(--card); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold; color: var(--text); }
    .power-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 500px; }
    .num-btn { background: var(--card); border: 1px solid rgba(255,255,255,0.2); color: var(--text); padding: 12px 0; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; }
    .num-btn:hover { background: var(--accent); color: #000; }

    .status-overlay { position: absolute; inset: 0; border-radius: 8px; display: none; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; backdrop-filter: blur(8px); z-index: 10; text-align: center; padding: 20px; }
    .overlay-frozen { background: rgba(56, 189, 248, 0.4); color: #fff; }
    .overlay-fog { background: rgba(0, 0, 0, 0.9); color: #fff; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); text-align: center; max-width: 300px; width: 90%; }

    canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <header>
    <h1>Sudoku Clash ⚔️</h1>
    <div class="stats-bar">
      <span>🏆 <b id="elo-val">1000</b> ELO</span>
      <span>⏱️ <b id="timer">00:00</b></span>
    </div>
  </header>

  <div class="lobby-card">
    <div class="lobby-row">
      <button class="btn btn-action" style="flex:1" onclick="createRoom()">Create Room 🏠</button>
      <input type="text" id="room-code-input" placeholder="ROOM CODE" maxlength="10">
      <button class="btn" onclick="joinRoom()">Join 🔗</button>
    </div>
    <div id="connection-status" style="font-size:0.8rem; text-align:center; color: var(--accent);">
      Mode: Practice vs AI Bot (Create room for 1v1)
    </div>
  </div>

  <div class="controls-top">
    <select id="theme-select" onchange="changeTheme(this.value)">
      <option value="dark">Dark Theme</option>
      <option value="cyberpunk">Cyberpunk Neon</option>
      <option value="arcade">8-Bit Arcade</option>
      <option value="light">Clean Light</option>
    </select>
    <select id="diff-select" onchange="startNewGame()">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button class="btn btn-action" onclick="startNewGame()">Reset 🔄</button>
  </div>

  <div class="battle-header">
    <div class="player-progress">
      <div class="progress-label"><span>You</span><span id="you-pct">0%</span></div>
      <div class="progress-track"><div id="you-bar" class="progress-fill fill-you"></div></div>
    </div>
    <div class="player-progress">
      <div class="progress-label"><span id="opp-label">Opponent Bot 🤖</span><span id="opp-pct">0%</span></div>
      <div class="progress-track"><div id="opp-bar" class="progress-fill fill-opp"></div></div>
    </div>
  </div>

  <div class="board-container">
    <div class="grid" id="grid"></div>
    <div class="status-overlay overlay-frozen" id="frozen-overlay">🧊 YOU ARE FROZEN!<br>(5 Seconds)</div>
    <div class="status-overlay overlay-fog" id="fog-overlay">🌫️ FOG ATTACK!<br>Board Blinded!</div>
  </div>

  <div class="powerups">
    <button class="power-btn" onclick="usePowerup('freeze')" id="btn-freeze">🧊 Freeze (1)</button>
    <button class="power-btn" onclick="usePowerup('fog')" id="btn-fog">🌫️ Fog (1)</button>
    <button class="power-btn" onclick="usePowerup('hint')" id="btn-hint">💡 Hint (2)</button>
  </div>

  <div class="numpad">
    <button class="num-btn" onclick="inputNumber(1)">1</button>
    <button class="num-btn" onclick="inputNumber(2)">2</button>
    <button class="num-btn" onclick="inputNumber(3)">3</button>
    <button class="num-btn" onclick="inputNumber(4)">4</button>
    <button class="num-btn" onclick="inputNumber(5)">5</button>
    <button class="num-btn" onclick="inputNumber(6)">6</button>
    <button class="num-btn" onclick="inputNumber(7)">7</button>
    <button class="num-btn" onclick="inputNumber(8)">8</button>
    <button class="num-btn" onclick="inputNumber(9)">9</button>
    <button class="num-btn" style="color:var(--accent-danger)" onclick="inputNumber(0)">⌫</button>
  </div>

  <div class="modal" id="game-modal">
    <div class="modal-content">
      <h2 id="modal-title">VICTORY!</h2>
      <p id="modal-desc">You crushed the game!</p>
      <button class="btn btn-action" style="width:100%; margin-top:15px;" onclick="closeModal(); startNewGame();">Next Match 🚀</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, duration, type = 'sine') {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const SFX = {
      click: () => playTone(440, 0.08),
      error: () => playTone(140, 0.25, 'sawtooth'),
      powerup: () => { playTone(520, 0.08); setTimeout(() => playTone(780, 0.12), 80); },
      win: () => { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 0.18), i * 100)); }
    };

    let solution = [], board = [], userBoard = [];
    let selectedCell = null, timerInterval = null, secondsElapsed = 0;
    let powerups = { freeze: 1, fog: 1, hint: 2 };
    let isFrozen = false, oppProgress = 0, botInterval = null;
    let elo = parseInt(localStorage.getItem('sudoku_elo') || '1000');

    let peer = null, conn = null, isHost = false, isOnline = false;

    document.getElementById('elo-val').innerText = elo;

    function changeTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
    }

    function generateSudoku(diff) {
      const base = Array.from({length: 81}, () => 0);
      solveSudoku(base);
      solution = [...base];
      const removal = { easy: 32, medium: 44, hard: 52 }[diff] || 44;
      board = [...solution];
      let removed = 0;
      while (removed < removal) {
        let idx = Math.floor(Math.random() * 81);
        if (board[idx] !== 0) { board[idx] = 0; removed++; }
      }
      userBoard = [...board];
    }

    function solveSudoku(b) {
      for (let i = 0; i < 81; i++) {
        if (b[i] === 0) {
          let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
          for (let num of nums) {
            if (isValid(b, i, num)) {
              b[i] = num;
              if (solveSudoku(b)) return true;
              b[i] = 0;
            }
          }
          return false;
        }
      }
      return true;
    }

    function isValid(b, idx, num) {
      let row = Math.floor(idx / 9), col = idx % 9;
      for (let i = 0; i < 9; i++) {
        if (b[row * 9 + i] === num || b[i * 9 + col] === num) return false;
        let boxRow = 3 * Math.floor(row / 3) + Math.floor(i / 3);
        let boxCol = 3 * Math.floor(col / 3) + (i % 3);
        if (b[boxRow * 9 + boxCol] === num) return false;
      }
      return true;
    }

    // Fixed WebRTC Direct Networking
    function createRoom() {
      isHost = true;
      const rawCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      const code = 'SUDO-' + rawCode;
      
      peer = new Peer(code);
      
      peer.on('open', (id) => {
        const shortCode = id.replace('SUDO-', '');
        document.getElementById('room-code-input').value = shortCode;
        navigator.clipboard.writeText(shortCode);
        document.getElementById('connection-status').innerText = `🏠 Room Code: ${shortCode} (Copied to Clipboard!)`;
      });

      peer.on('connection', (c) => {
        conn = c;
        c.on('open', () => {
          isOnline = true;
          if (botInterval) clearInterval(botInterval);
          document.getElementById('connection-status').innerText = "🟢 Real Player Connected! Game Synced!";
          document.getElementById('opp-label').innerText = "Real Opponent 👤";
          setupConnection();
          syncBoardToPeer();
        });
      });

      peer.on('error', (err) => {
        document.getElementById('connection-status').innerText = "⚠️ Room error. Retrying...";
      });
    }

    function joinRoom() {
      let inputVal = document.getElementById('room-code-input').value.trim().toUpperCase();
      if (!inputVal) return alert("Please enter a 4-letter Room Code!");
      
      const fullCode = inputVal.startsWith('SUDO-') ? inputVal : 'SUDO-' + inputVal;
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(fullCode);
        conn.on('open', () => {
          isHost = false;
          isOnline = true;
          if (botInterval) clearInterval(botInterval);
          document.getElementById('connection-status').innerText = "🟢 Connected to Room Host!";
          document.getElementById('opp-label').innerText = "Host Opponent 👤";
          setupConnection();
        });
      });
    }

    function setupConnection() {
      conn.on('data', (data) => {
        if (data.type === 'progress') {
          oppProgress = data.value;
          document.getElementById('opp-bar').style.width = oppProgress + '%';
          document.getElementById('opp-pct').innerText = oppProgress + '%';
          if (oppProgress >= 100) triggerGameOver(false);
        } else if (data.type === 'attack') {
          receiveAttack(data.attack);
        } else if (data.type === 'sync') {
          solution = data.solution;
          board = data.board;
          userBoard = [...board];
          renderBoard();
        }
      });
    }

    function syncBoardToPeer() {
      if (conn && conn.open) {
        conn.send({ type: 'sync', solution, board });
      }
    }

    function renderBoard() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let i = 0; i < 81; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (board[i] !== 0) {
          cell.innerText = board[i];
          cell.classList.add('given');
        } else if (userBoard[i] !== 0) {
          cell.innerText = userBoard[i];
          cell.classList.add('user-entered');
        }
        cell.onclick = () => selectCell(i);
        grid.appendChild(cell);
      }
      updateHighlights();
      updateProgress();
    }

    function selectCell(idx) {
      if (isFrozen) return;
      SFX.click();
      selectedCell = idx;
      updateHighlights();
    }

    function updateHighlights() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach((c, i) => {
        c.classList.remove('selected', 'related');
        if (selectedCell !== null) {
          if (i === selectedCell) c.classList.add('selected');
          else if (Math.floor(i / 9) === Math.floor(selectedCell / 9) || i % 9 === selectedCell % 9) {
            c.classList.add('related');
          }
        }
      });
    }

    function inputNumber(num) {
      if (selectedCell === null || board[selectedCell] !== 0 || isFrozen) return;
      if (num === 0) {
        userBoard[selectedCell] = 0;
      } else {
        if (num === solution[selectedCell]) SFX.click();
        else SFX.error();
        userBoard[selectedCell] = num;
      }
      renderBoard();
      checkWinCondition();
    }

    function updateProgress() {
      let filled = 0, totalEmpty = 81 - board.filter(x => x !== 0).length;
      userBoard.forEach((val, i) => {
        if (board[i] === 0 && val === solution[i]) filled++;
      });
      let pct = Math.round((filled / totalEmpty) * 100);
      document.getElementById('you-bar').style.width = pct + '%';
      document.getElementById('you-pct').innerText = pct + '%';

      if (conn && conn.open) conn.send({ type: 'progress', value: pct });
    }

    function usePowerup(type) {
      if (powerups[type] <= 0) return;
      SFX.powerup();
      powerups[type]--;
      document.getElementById(`btn-${type}`).innerText = `${type.toUpperCase()} (${powerups[type]})`;

      if (type === 'hint' && selectedCell !== null && board[selectedCell] === 0) {
        userBoard[selectedCell] = solution[selectedCell];
        renderBoard();
      } else if (conn && conn.open) {
        conn.send({ type: 'attack', attack: type });
      } else {
        if (type === 'freeze') oppProgress = Math.max(0, oppProgress - 8);
      }
    }

    function receiveAttack(type) {
      SFX.error();
      if (type === 'freeze') {
        isFrozen = true;
        const ov = document.getElementById('frozen-overlay');
        ov.style.display = 'flex';
        setTimeout(() => { isFrozen = false; ov.style.display = 'none'; }, 5000);
      } else if (type === 'fog') {
        const fog = document.getElementById('fog-overlay');
        fog.style.display = 'flex';
        setTimeout(() => fog.style.display = 'none', 4000);
      }
    }

    function startBot() {
      if (botInterval) clearInterval(botInterval);
      if (isOnline) return;
      oppProgress = 0;
      botInterval = setInterval(() => {
        if (oppProgress < 100) {
          oppProgress += Math.floor(Math.random() * 3) + 1;
          document.getElementById('opp-bar').style.width = oppProgress + '%';
          document.getElementById('opp-pct').innerText = oppProgress + '%';
          if (oppProgress >= 100) triggerGameOver(false);
        }
      }, 1600);
    }

    function checkWinCondition() {
      let isComplete = userBoard.every((val, i) => val === solution[i]);
      if (isComplete) triggerGameOver(true);
    }

    function triggerGameOver(isWin) {
      clearInterval(timerInterval);
      if (botInterval) clearInterval(botInterval);

      const modal = document.getElementById('game-modal');
      const title = document.getElementById('modal-title');
      const desc = document.getElementById('modal-desc');

      if (isWin) {
        SFX.win();
        launchConfetti();
        elo += 25;
        title.innerText = "VICTORY! 🏆";
        desc.innerText = `Matched finished in ${secondsElapsed}s. +25 ELO!`;
      } else {
        SFX.error();
        elo = Math.max(800, elo - 15);
        title.innerText = "DEFEAT! 💀";
        title.style.color = "var(--accent-danger)";
        desc.innerText = "Opponent solved their board first! -15 ELO";
      }

      localStorage.setItem('sudoku_elo', elo);
      document.getElementById('elo-val').innerText = elo;
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('game-modal').classList.remove('active');
    }

    function startNewGame() {
      const diff = document.getElementById('diff-select').value;
      generateSudoku(diff);
      selectedCell = null;
      secondsElapsed = 0;
      powerups = { freeze: 1, fog: 1, hint: 2 };

      document.getElementById('btn-freeze').innerText = `🧊 Freeze (1)`;
      document.getElementById('btn-fog').innerText = `🌫️ Fog (1)`;
      document.getElementById('btn-hint').innerText = `💡 Hint (2)`;

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        let m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        let s = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;
      }, 1000);

      renderBoard();
      syncBoardToPeer();
      if (!isOnline) startBot();
    }

    function launchConfetti() {
      const cvs = document.getElementById('confetti');
      const ctx = cvs.getContext('2d');
      cvs.width = window.innerWidth; cvs.height = window.innerHeight;
      let particles = Array.from({length: 70}, () => ({
        x: cvs.width / 2, y: cvs.height / 2,
        vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10 - 3,
        size: Math.random() * 8 + 4, color: `hsl(${Math.random()*360}, 100%, 50%)`
      }));

      function render() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.2;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        if (particles.some(p => p.y < cvs.height)) requestAnimationFrame(render);
      }
      render();
    }

    window.onload = startNewGame;
  </script>
</body>
</html>

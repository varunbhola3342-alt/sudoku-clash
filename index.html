<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Clash 1v1</title>

  <style>
    :root {
      --primary: #2563eb;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      position: relative;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { font-size: 24px; color: #38bdf8; font-weight: 800; }

    .icon-btn {
      background: #334155;
      border: 1px solid #475569;
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    /* LOBBY SPECIFIC STYLES */
    .wallet-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      margin-bottom: 15px;
    }

    .wallet-amount { color: var(--success); font-weight: 800; font-size: 18px; }

    .mode-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .mode-card {
      flex: 1;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-card.selected { border-color: var(--primary); background: rgba(37, 99, 235, 0.1); }
    .mode-card h4 { font-size: 14px; color: #38bdf8; }
    .mode-card p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* GAME SPECIFIC STYLES */
    .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .status-badge { font-size: 15px; font-weight: 700; color: #38bdf8; }
    .timer-badge {
      font-size: 16px; font-weight: 700; color: var(--success);
      background: rgba(34, 197, 94, 0.1); padding: 4px 10px; border-radius: 6px;
    }

    .player-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .player-label { width: 90px; font-weight: 600; }
    .progress-bar-bg { flex: 1; height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s ease; }

    /* Grid */
    #board-wrapper { position: relative; width: 100%; }
    #sudoku-board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      aspect-ratio: 1;
      width: 100%;
      background-color: #000;
      border: 3px solid #475569;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .cell {
      width: 100%; height: 100%; text-align: center; font-size: 20px;
      font-weight: 700; border: 1px solid #334155; outline: none;
      color: var(--text); background-color: #1e293b;
    }
    .cell.given { background-color: #334155; color: #94a3b8; }
    .cell.hinted { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .cell:nth-child(3n) { border-right: 3px solid #475569; }
    .cell:nth-child(9n) { border-right: 1px solid #334155; }
    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid #475569; }

    /* Emote Bar */
    .emote-bar {
      display: flex; justify-content: center; gap: 10px; width: 100%;
      background: var(--card-bg); padding: 8px; border-radius: 30px; border: 1px solid #334155;
    }
    .emote-btn { background: transparent; border: none; font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 50%; }
    .floating-emote {
      position: absolute; font-size: 45px; pointer-events: none;
      animation: floatUp 1.2s ease-out forwards; z-index: 50;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(20px) scale(0.5); }
      30% { opacity: 1; transform: translateY(-10px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-80px) scale(1); }
    }

    .btn {
      width: 100%; padding: 12px; font-size: 15px; font-weight: 700;
      border-radius: 8px; border: none; cursor: pointer; transition: background 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-warning { background: var(--warning); color: #000; }

    /* Result Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px); display: flex; align-items: center;
      justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-box {
      background: var(--card-bg); border: 1px solid #334155;
      border-radius: 16px; padding: 30px; width: 90%; max-width: 380px; text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>⚡ SUDOKU CLASH</h1>
      <button class="icon-btn" id="sound-btn" onclick="toggleSound()">🔊 Sound ON</button>
    </header>

    <!-- 1. MAIN MENU / LOBBY SCREEN -->
    <div id="lobby-screen" class="card">
      <div class="wallet-box">
        <div>
          <div style="font-size: 11px; color: var(--text-muted);">DEMO WALLET</div>
          <div class="wallet-amount" id="user-balance">$10.00</div>
        </div>
        <button class="icon-btn" onclick="alert('Wallet deposit system connects here in Phase 4!')">+ Add Cash</button>
      </div>

      <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">SELECT MATCH ENTRY</div>
      <div class="mode-selector">
        <div class="mode-card selected">
          <h4>Free Match</h4>
          <p>Practice 1v1</p>
        </div>
        <div class="mode-card" onclick="alert('Paid stakes unlock in Phase 4 with payment gateways!')">
          <h4>$1.00 Stake</h4>
          <p>Win $1.80</p>
        </div>
      </div>

      <button class="btn btn-primary" onclick="enterMatchmaking()">🎮 Find 1v1 Match</button>
    </div>

    <!-- 2. GAMEPLAY SCREEN (Hidden until match starts) -->
    <div id="game-screen" style="display: none; width: 100%; flex-direction: column; gap: 15px;">
      <div class="card">
        <div class="status-header">
          <span class="status-badge" id="status">Connecting...</span>
          <span class="timer-badge" id="timer">00:00</span>
        </div>
        <div class="player-row">
          <span class="player-label" id="you-label">You: 0%</span>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="you-bar"></div>
          </div>
        </div>
      </div>

      <div id="board-wrapper">
        <div id="sudoku-board"></div>
        <div id="emote-layer"></div>
      </div>

      <div class="emote-bar">
        <button class="emote-btn" onclick="sendEmote('👏')">👏</button>
        <button class="emote-btn" onclick="sendEmote('⚡')">⚡</button>
        <button class="emote-btn" onclick="sendEmote('😅')">😅</button>
        <button class="emote-btn" onclick="sendEmote('🤝')">🤝</button>
        <button class="emote-btn" onclick="sendEmote('🔥')">🔥</button>
      </div>

      <button class="btn btn-warning" id="hint-btn" onclick="useHint()">
        💡 Use Hint (+10s Penalty) [3 Left]
      </button>
    </div>
  </div>

  <!-- RESULT MODAL -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal-box">
      <div style="font-size: 50px; margin-bottom: 10px;" id="modal-icon">🏆</div>
      <div style="font-size: 24px; font-weight: 800; margin-bottom: 8px;" id="modal-title">VICTORY!</div>
      <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;" id="modal-subtitle">You solved it first!</div>
      <button class="btn btn-primary" onclick="returnToLobby()">Return to Lobby</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://uckahvsyosajrpxgpiiu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVja2FodnN5b3NhanJweGdwaWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NDg0OTYsImV4cCI6MjEwMDQyNDQ5Nn0.ELumAR-bxZH33cRWOXtnlXprB65hq6GssFdpVmRXEZg";

    const samplePuzzle = "530070000600195000098000060800060003400803001700020006060000280004001500000000002";
    const sampleSolution = "534678912672195348198342567859761423426853791713924856961537284287419635345286179";

    let secondsElapsed = 0;
    let timerInterval = null;
    let pollInterval = null;
    let currentMatch = null;
    let isGameOver = false;
    let isMuted = false;
    let hintsRemaining = 3;

    const myPlayerId = "User_" + Math.floor(Math.random() * 899 + 100);

    // Audio Engine
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playTone(freq, type, duration) {
      if (isMuted) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundKeypress() { playTone(587.33, 'sine', 0.08); }
    function soundEmote() { playTone(880, 'sine', 0.15); }
    function soundHint() { playTone(440, 'triangle', 0.2); }
    function soundVictory() {
      if (isMuted) return;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => setTimeout(() => playTone(freq, 'triangle', 0.3), idx * 120));
    }
    function soundDefeat() {
      if (isMuted) return;
      [400, 350, 300, 220].forEach((freq, idx) => setTimeout(() => playTone(freq, 'sawtooth', 0.25), idx * 150));
    }
    function toggleSound() {
      isMuted = !isMuted;
      document.getElementById('sound-btn').innerText = isMuted ? "🔇 Muted" : "🔊 Sound ON";
    }

    // Emotes
    function sendEmote(char) { soundEmote(); showFloatingEmote(char); }
    function showFloatingEmote(char) {
      const layer = document.getElementById('emote-layer');
      const el = document.createElement('div');
      el.classList.add('floating-emote');
      el.innerText = char;
      el.style.left = `${Math.random() * 70 + 15}%`;
      el.style.top = `60%`;
      layer.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }

    // Navigation
    function enterMatchmaking() {
      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      renderBoard();
      initMatchmaking();
    }

    function returnToLobby() {
      document.getElementById('result-modal').classList.remove('active');
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('lobby-screen').style.display = 'block';
      isGameOver = false;
      currentMatch = null;
      hintsRemaining = 3;
      document.getElementById('hint-btn').innerText = `💡 Use Hint (+10s Penalty) [3 Left]`;
      document.getElementById('hint-btn').disabled = false;
    }

    // Game Core
    function renderBoard() {
      const board = document.getElementById('sudoku-board');
      board.innerHTML = '';

      for (let i = 0; i < 81; i++) {
        const input = document.createElement('input');
        input.type = 'text'; input.maxLength = 1;
        input.classList.add('cell'); input.dataset.index = i;

        const char = samplePuzzle[i];
        if (char !== '0') {
          input.value = char; input.readOnly = true; input.classList.add('given');
        } else {
          input.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^1-9]/g, '');
            if (e.target.value) soundKeypress();
            updateProgress();
            checkWinCondition();
          });
        }
        board.appendChild(input);
      }
      updateProgress();
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      secondsElapsed = 0;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
      const secs = (secondsElapsed % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `${mins}:${secs}`;
    }

    // 💡 HINT SYSTEM (+10s Penalty)
    function useHint() {
      if (isGameOver || hintsRemaining <= 0) return;

      const cells = document.querySelectorAll('.cell');
      const emptyIndices = [];

      cells.forEach((cell, idx) => {
        if (!cell.readOnly && cell.value !== sampleSolution[idx]) {
          emptyIndices.push(idx);
        }
      });

      if (emptyIndices.length > 0) {
        hintsRemaining--;
        soundHint();

        // Add 10-second penalty
        secondsElapsed += 10;
        updateTimerDisplay();

        // Pick random empty cell and insert correct answer
        const targetIdx = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        const targetCell = cells[targetIdx];
        targetCell.value = sampleSolution[targetIdx];
        targetCell.classList.add('hinted');
        targetCell.readOnly = true;

        const btn = document.getElementById('hint-btn');
        btn.innerText = `💡 Use Hint (+10s Penalty) [${hintsRemaining} Left]`;
        if (hintsRemaining === 0) btn.disabled = true;

        updateProgress();
        checkWinCondition();
      }
    }

    function updateProgress() {
      const cells = document.querySelectorAll('.cell');
      let filled = 0;
      cells.forEach(cell => { if (cell.value) filled++; });
      const pct = Math.round((filled / 81) * 100);
      document.getElementById('you-label').innerText = `You: ${pct}%`;
      document.getElementById('you-bar').style.width = `${pct}%`;
    }

    async function initMatchmaking() {
      const statusEl = document.getElementById('status');
      statusEl.innerText = "Finding Opponent...";

      try {
        const findRes = await fetch(`${SUPABASE_URL}/rest/v1/matches?status=eq.waiting&limit=1`, {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const openMatches = await findRes.json();

        if (Array.isArray(openMatches) && openMatches.length > 0) {
          currentMatch = openMatches[0];
          await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${currentMatch.id}`, {
            method: 'PATCH',
            headers: {
              'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ player2_id: myPlayerId, status: 'in_progress' })
          });
          statusEl.innerText = `VS ${currentMatch.player1_id}`;
          startTimer();
        } else {
          const createRes = await fetch(`${SUPABASE_URL}/rest/v1/matches`, {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
              'Content-Type': 'application/json', 'Prefer': 'return=representation'
            },
            body: JSON.stringify({
              seed_puzzle: samplePuzzle, solution: sampleSolution,
              player1_id: myPlayerId, status: 'waiting'
            })
          });
          const newMatch = await createRes.json();
          currentMatch = newMatch[0];
          statusEl.innerText = "Waiting for player...";
        }
        startMatchPolling();
      } catch (err) {
        statusEl.innerText = "Local Match";
        startTimer();
      }
    }

    function startMatchPolling() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        if (!currentMatch || isGameOver) return;
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${currentMatch.id}`, {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
          });
          const data = await res.json();
          if (!data || data.length === 0) return;

          const updatedMatch = data[0];
          const statusEl = document.getElementById('status');

          if (currentMatch.status === 'waiting' && updatedMatch.status === 'in_progress') {
            currentMatch.status = 'in_progress';
            const oppName = updatedMatch.player1_id === myPlayerId ? updatedMatch.player2_id : updatedMatch.player1_id;
            statusEl.innerText = `VS ${oppName}`;
            startTimer();
          }

          if (updatedMatch.status === 'completed' && updatedMatch.winner_id && updatedMatch.winner_id !== myPlayerId) {
            triggerGameOver(false, updatedMatch.winner_id);
          }
        } catch (e) {}
      }, 1200);
    }

    async function checkWinCondition() {
      if (isGameOver) return;

      const cells = document.querySelectorAll('.cell');
      let currentAnswers = "";
      cells.forEach(cell => { currentAnswers += cell.value || "0"; });

      if (currentAnswers === sampleSolution) {
        if (currentMatch) {
          await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${currentMatch.id}`, {
            method: 'PATCH',
            headers: {
              'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              status: 'completed', winner_id: myPlayerId, player1_time: secondsElapsed
            })
          });
        }
        triggerGameOver(true);
      }
    }

    function triggerGameOver(isWin, winnerName) {
      isGameOver = true;
      clearInterval(timerInterval); clearInterval(pollInterval);

      const modal = document.getElementById('result-modal');
      const title = document.getElementById('modal-title');
      const subtitle = document.getElementById('modal-subtitle');

      if (isWin) {
        soundVictory();
        document.getElementById('modal-icon').innerText = "🏆";
        title.innerText = "VICTORY!"; title.style.color = "#22c55e";
        subtitle.innerText = `You solved the Sudoku in ${secondsElapsed} seconds!`;
      } else {
        soundDefeat();
        document.getElementById('modal-icon').innerText = "💀";
        title.innerText = "DEFEAT!"; title.style.color = "#ef4444";
        subtitle.innerText = `${winnerName || 'Opponent'} solved the board first!`;
      }
      modal.classList.add('active');
    }
  </script>
</body>
</html>

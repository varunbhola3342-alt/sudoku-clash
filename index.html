<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Clash 1v1 | Ultra</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-danger: #f43f5e;
      --accent-success: #10b981;
      --text: #f8fafc;
      --cell-bg: #334155;
      --cell-selected: #0284c7;
      --cell-highlight: #475569;
      --given-text: #e2e8f0;
      --user-text: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }

    header { display: flex; justify-content: space-between; width: 100%; max-width: 500px; margin-bottom: 12px; align-items: center; }
    h1 { font-size: 1.5rem; color: var(--accent); letter-spacing: 1px; }

    .stats-bar { display: flex; gap: 10px; font-size: 0.85rem; background: var(--card); padding: 6px 12px; border-radius: 20px; border: 1px solid #475569; }

    /* Progress & Status */
    .battle-header { width: 100%; max-width: 500px; background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
    .player-progress { margin-bottom: 8px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; font-weight: bold; }
    .progress-track { width: 100%; height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; transition: width 0.3s ease; }
    .fill-you { background: var(--accent); }
    .fill-opp { background: var(--accent-danger); }

    /* Controls Header */
    .controls-top { display: flex; gap: 8px; width: 100%; max-width: 500px; margin-bottom: 12px; }
    select, .btn { background: var(--card); border: 1px solid #475569; color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
    select:hover, .btn:hover { background: #334155; border-color: var(--accent); }
    .btn-action { background: var(--accent); color: #0f172a; border: none; }
    .btn-action:hover { background: #7dd3fc; }

    /* Sudoku Board */
    .board-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 1; margin-bottom: 15px; }
    .grid { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); gap: 1px; background: #64748b; border: 3px solid #64748b; border-radius: 8px; width: 100%; height: 100%; overflow: hidden; }
    
    .cell { background: var(--cell-bg); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; cursor: pointer; transition: background 0.15s; }
    .cell.given { color: var(--given-text); background: #1e293b; }
    .cell.user-entered { color: var(--user-text); }
    .cell.selected { background: var(--cell-selected) !important; color: #fff; }
    .cell.related { background: var(--cell-highlight); }
    .cell.error { background: var(--accent-danger) !important; color: #fff; }

    /* 3x3 Grid Borders */
    .cell:nth-child(3n) { border-right: 2px solid #64748b; }
    .cell:nth-child(9n) { border-right: none; }
    .cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #64748b; }

    /* Power-Ups Bar */
    .powerups { display: flex; gap: 10px; width: 100%; max-width: 500px; margin-bottom: 12px; }
    .power-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; background: var(--card); border: 1px solid #475569; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: all 0.2s; }
    .power-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .power-btn:not(:disabled):hover { border-color: var(--accent); transform: translateY(-2px); }

    /* Numpad */
    .numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 500px; }
    .num-btn { background: var(--card); border: 1px solid #475569; color: var(--text); padding: 14px 0; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.15s; text-align: center; }
    .num-btn:hover { background: var(--accent); color: #0f172a; }

    /* Overlays & Effects */
    .frozen-overlay, .fog-overlay { position: absolute; inset: 0; border-radius: 8px; display: none; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; backdrop-filter: blur(8px); z-index: 10; }
    .frozen-overlay { background: rgba(56, 189, 248, 0.3); color: #e0f2fe; }
    .fog-overlay { background: rgba(15, 23, 42, 0.85); color: #94a3b8; }
    
    .shake { animation: shake 0.3s ease-in-out; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid #475569; text-align: center; max-width: 320px; width: 90%; }
    .modal-content h2 { color: var(--accent); margin-bottom: 10px; font-size: 1.8rem; }
    .modal-content p { margin-bottom: 20px; color: #94a3b8; }

    canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <header>
    <h1>Sudoku Clash ⚔️</h1>
    <div class="stats-bar">
      <span>🔥 Streak: <b id="streak-val">0</b></span>
      <span>⏱️ <b id="timer">00:00</b></span>
    </div>
  </header>

  <div class="controls-top">
    <select id="diff-select" onchange="startNewGame()">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button class="btn btn-action" style="flex:1" onclick="startNewGame()">New Game 🔄</button>
  </div>

  <div class="battle-header">
    <div class="player-progress">
      <div class="progress-label"><span>You</span><span id="you-pct">0%</span></div>
      <div class="progress-track"><div id="you-bar" class="progress-fill fill-you"></div></div>
    </div>
    <div class="player-progress">
      <div class="progress-label"><span>Opponent Bot 🤖</span><span id="opp-pct">0%</span></div>
      <div class="progress-track"><div id="opp-bar" class="progress-fill fill-opp"></div></div>
    </div>
  </div>

  <div class="board-container">
    <div class="grid" id="grid"></div>
    <div class="frozen-overlay" id="frozen-overlay">🧊 FROZEN! (5s)</div>
    <div class="fog-overlay" id="fog-overlay">🌫️ FOG OF WAR!</div>
  </div>

  <div class="powerups">
    <button class="power-btn" onclick="usePowerup('freeze')" id="btn-freeze">🧊 Freeze (1)</button>
    <button class="power-btn" onclick="usePowerup('fog')" id="btn-fog">🌫️ Fog (1)</button>
    <button class="power-btn" onclick="usePowerup('hint')" id="btn-hint">💡 Hint (2)</button>
  </div>

  <div class="numpad">
    <button class="num-btn" onclick="inputNumber(1)">1</button>
    <button class="num-btn" onclick="inputNumber(2)">2</button>
    <button class="num-btn" onclick="inputNumber(3)">3</button>
    <button class="num-btn" onclick="inputNumber(4)">4</button>
    <button class="num-btn" onclick="inputNumber(5)">5</button>
    <button class="num-btn" onclick="inputNumber(6)">6</button>
    <button class="num-btn" onclick="inputNumber(7)">7</button>
    <button class="num-btn" onclick="inputNumber(8)">8</button>
    <button class="num-btn" onclick="inputNumber(9)">9</button>
    <button class="num-btn" style="color:var(--accent-danger)" onclick="inputNumber(0)">⌫</button>
  </div>

  <!-- End Game Modal -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <h2 id="modal-title">VICTORY!</h2>
      <p id="modal-desc">You crushed your opponent!</p>
      <button class="btn btn-action" style="width:100%" onclick="closeModal(); startNewGame();">Play Again 🚀</button>
    </div>
  </div>

  <script>
    // Audio Synthesizer (No external MP3 files required!)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, duration, type = 'sine') {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const SFX = {
      click: () => playTone(440, 0.08),
      error: () => playTone(150, 0.25, 'sawtooth'),
      powerup: () => { playTone(587, 0.1); setTimeout(() => playTone(880, 0.15), 100); },
      win: () => { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 0.2), i * 120)); }
    };

    // Game Variables
    let solution = [], board = [], userBoard = [];
    let selectedCell = null;
    let timerInterval = null, secondsElapsed = 0;
    let powerups = { freeze: 1, fog: 1, hint: 2 };
    let isFrozen = false, oppProgress = 0, botInterval = null;
    let streak = parseInt(localStorage.getItem('sudoku_streak') || '0');

    document.getElementById('streak-val').innerText = streak;

    // Helper: Generate Solved Sudoku & Puzzle
    function generateSudoku(diff) {
      const base = Array.from({length: 81}, () => 0);
      solveSudoku(base);
      solution = [...base];
      
      const removalCounts = { easy: 35, medium: 45, hard: 52 };
      const toRemove = removalCounts[diff] || 45;
      
      board = [...solution];
      let removed = 0;
      while (removed < toRemove) {
        let idx = Math.floor(Math.random() * 81);
        if (board[idx] !== 0) {
          board[idx] = 0;
          removed++;
        }
      }
      userBoard = [...board];
    }

    function solveSudoku(b) {
      for (let i = 0; i < 81; i++) {
        if (b[i] === 0) {
          let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
          for (let num of nums) {
            if (isValid(b, i, num)) {
              b[i] = num;
              if (solveSudoku(b)) return true;
              b[i] = 0;
            }
          }
          return false;
        }
      }
      return true;
    }

    function isValid(b, idx, num) {
      let row = Math.floor(idx / 9), col = idx % 9;
      for (let i = 0; i < 9; i++) {
        if (b[row * 9 + i] === num || b[i * 9 + col] === num) return false;
        let boxRow = 3 * Math.floor(row / 3) + Math.floor(i / 3);
        let boxCol = 3 * Math.floor(col / 3) + (i % 3);
        if (b[boxRow * 9 + boxCol] === num) return false;
      }
      return true;
    }

    // Render Grid
    function renderBoard() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let i = 0; i < 81; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (board[i] !== 0) {
          cell.innerText = board[i];
          cell.classList.add('given');
        } else if (userBoard[i] !== 0) {
          cell.innerText = userBoard[i];
          cell.classList.add('user-entered');
        }
        cell.onclick = () => selectCell(i);
        grid.appendChild(cell);
      }
      updateHighlights();
      updateProgress();
    }

    function selectCell(idx) {
      if (isFrozen) return;
      SFX.click();
      selectedCell = idx;
      updateHighlights();
    }

    function updateHighlights() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach((c, i) => {
        c.classList.remove('selected', 'related');
        if (selectedCell !== null) {
          if (i === selectedCell) c.classList.add('selected');
          else if (Math.floor(i / 9) === Math.floor(selectedCell / 9) || i % 9 === selectedCell % 9) {
            c.classList.add('related');
          }
        }
      });
    }

    function inputNumber(num) {
      if (selectedCell === null || board[selectedCell] !== 0 || isFrozen) return;

      if (num === 0) {
        userBoard[selectedCell] = 0;
      } else {
        if (num === solution[selectedCell]) {
          SFX.click();
          userBoard[selectedCell] = num;
        } else {
          SFX.error();
          document.querySelector('.board-container').classList.add('shake');
          setTimeout(() => document.querySelector('.board-container').classList.remove('shake'), 300);
          userBoard[selectedCell] = num; // Accepts input but marks/checks later
        }
      }
      renderBoard();
      checkWinCondition();
    }

    function updateProgress() {
      let filled = 0, totalEmpty = 81 - board.filter(x => x !== 0).length;
      userBoard.forEach((val, i) => {
        if (board[i] === 0 && val === solution[i]) filled++;
      });
      let pct = Math.round((filled / totalEmpty) * 100);
      document.getElementById('you-bar').style.width = pct + '%';
      document.getElementById('you-pct').innerText = pct + '%';
    }

    // Power-Up Actions
    function usePowerup(type) {
      if (powerups[type] <= 0) return;
      SFX.powerup();
      powerups[type]--;
      document.getElementById(`btn-${type}`).innerText = `${type.toUpperCase()} (${powerups[type]})`;

      if (type === 'hint' && selectedCell !== null && board[selectedCell] === 0) {
        userBoard[selectedCell] = solution[selectedCell];
        renderBoard();
      } else if (type === 'freeze') {
        // Simulating freezing opponent logic
        oppProgress = Math.max(0, oppProgress - 5);
        document.getElementById('opp-bar').style.width = oppProgress + '%';
        document.getElementById('opp-pct').innerText = oppProgress + '%';
      } else if (type === 'fog') {
        const fog = document.getElementById('fog-overlay');
        fog.style.display = 'flex';
        setTimeout(() => fog.style.display = 'none', 4000);
      }
    }

    // Simulated Bot Opponent
    function startBot() {
      if (botInterval) clearInterval(botInterval);
      oppProgress = 0;
      botInterval = setInterval(() => {
        if (oppProgress < 100) {
          oppProgress += Math.floor(Math.random() * 3) + 1;
          if (oppProgress > 100) oppProgress = 100;
          document.getElementById('opp-bar').style.width = oppProgress + '%';
          document.getElementById('opp-pct').innerText = oppProgress + '%';
          if (oppProgress === 100) triggerGameOver(false);
        }
      }, 1500);
    }

    function checkWinCondition() {
      let isComplete = userBoard.every((val, i) => val === solution[i]);
      if (isComplete) triggerGameOver(true);
    }

    function triggerGameOver(isWin) {
      clearInterval(timerInterval);
      clearInterval(botInterval);

      const modal = document.getElementById('game-modal');
      const title = document.getElementById('modal-title');
      const desc = document.getElementById('modal-desc');

      if (isWin) {
        SFX.win();
        launchConfetti();
        streak++;
        title.innerText = "VICTORY! 🔥";
        desc.innerText = `You solved the Sudoku in ${secondsElapsed} seconds!`;
      } else {
        SFX.error();
        streak = 0;
        title.innerText = "DEFEAT! 💀";
        title.style.color = "var(--accent-danger)";
        desc.innerText = "Opponent completed the board first!";
      }

      localStorage.setItem('sudoku_streak', streak);
      document.getElementById('streak-val').innerText = streak;
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('game-modal').classList.remove('active');
    }

    function startNewGame() {
      const diff = document.getElementById('diff-select').value;
      generateSudoku(diff);
      selectedCell = null;
      secondsElapsed = 0;
      powerups = { freeze: 1, fog: 1, hint: 2 };

      document.getElementById('btn-freeze').innerText = `🧊 Freeze (1)`;
      document.getElementById('btn-fog').innerText = `🌫️ Fog (1)`;
      document.getElementById('btn-hint').innerText = `💡 Hint (2)`;

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        let m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        let s = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;
      }, 1000);

      renderBoard();
      startBot();
    }

    // Confetti Physics
    function launchConfetti() {
      const cvs = document.getElementById('confetti');
      const ctx = cvs.getContext('2d');
      cvs.width = window.innerWidth; cvs.height = window.innerHeight;
      let particles = Array.from({length: 80}, () => ({
        x: cvs.width / 2, y: cvs.height / 2,
        vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12 - 4,
        size: Math.random() * 8 + 4, color: `hsl(${Math.random()*360}, 100%, 50%)`
      }));

      function render() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.2;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        if (particles.some(p => p.y < cvs.height)) requestAnimationFrame(render);
      }
      render();
    }

    // Boot
    window.onload = startNewGame;
  </script>
</body>
</html>
